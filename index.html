      setTimeout(fit, 40);
    } } }));
  }

  function readFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { handleText(String(r.result), f.name); };
    r.onerror = function () { fail("Couldn't read that file."); };
    r.readAsText(f);
  }

  drop.addEventListener("click", function () { file.click(); });
  drop.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); file.click(); }
  });
  file.addEventListener("change", function () { readFile(file.files && file.files[0]); });
  ["dragenter", "dragover"].forEach(function (t) {
    drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (t) {
    drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (ev) {
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) readFile(f);
  });

  openModal([body, footer]);
}

/* ════════════════════════════════════════════════════════════════════════
   PLAYTEST — walk the board the way a session would, one encounter at a
   time, carrying a wallet of flags. Read-only: a run never edits the board.

   The data model puts flags on the encounter (out / in) while the prose says
   which choice sets or needs them, so the run reads the fx text to work out
   choice-level grants and gates, and shows every inference on screen — a
   choice that sets nothing, or a flag no choice can reach, is a finding.
   ═══════════════════════════════════════════════════════════════════════ */

var playEl = $("#play");
var run = null;

/* ── engine state & the effect interpreter ────────────────────────────── */

function newRunState(faction) {
  return {
    phase: "setup", faction: faction || "any", turn: 0, round: 0,
    wallet: {}, visited: {}, path: [], lockedSeen: [],
    resources: {}, tracks: {}, standing: {}, honor: 0, menace: 0,
    quests: {}, deferred: [], asks: [], rolls: [], techLevel: 0
  };
}

// Condition language: has_flag / count_flags / all / any / not / op+score.
// Anything unrecognised returns true and is recorded, so an unknown gate opens
// the content rather than hiding it.
function evalCondition(c, unknown) {
  if (c === null || c === undefined) return true;
  if (typeof c === "boolean") return c;
  if (typeof c !== "object") return !!c;
  if (c.has_flag) return !!run.wallet[flagName(c.has_flag)];
  if (c.not) return !evalCondition(c.not, unknown);
  if (c.all) return c.all.every(function (x) { return evalCondition(x, unknown); });
  if (c.any) return c.any.some(function (x) { return evalCondition(x, unknown); });
  if (c.op) {
    // An operand the walk has no model for (a unit count, a map fact) used to
    // fall through to a comparison against a raw object and quietly answer
    // false — closing the gate and hiding the content behind it. Unknown
    // operands open, the same as an unknown operator does below.
    var seen = [];
    var l = evalValue(c.left, seen), r = evalValue(c.right, seen);
    if (seen.length) {
      if (unknown) seen.forEach(function (u) { unknown.push(u); });
      return true;
    }
    switch (c.op) {
      case "eq":  return l === r;
      case "ne":  return l !== r;
      case "lt":  return l < r;
      case "lte": return l <= r;
      case "gt":  return l > r;
      case "gte": return l >= r;
    }
  }
  if (unknown) unknown.push(Object.keys(c).join(","));
  return true;
}

function evalValue(v, unknown) {
  if (v === null || v === undefined) return v;
  if (typeof v === "number" || typeof v === "boolean") return v;
  if (typeof v === "string") {
    if (v === "active") return run.faction;                       // faction-of-active-player
    if (v === "players.active.techLevel") return run.techLevel;
    return v;
  }
  if (typeof v === "object") {
    if (v.count_flags) {
      var pre = v.count_flags.prefix || "";
      return Object.keys(run.wallet).filter(function (f) { return f.indexOf(pre) === 0; }).length;
    }
    if (v.score) {
      var k = v.score.kind;
      if (k === "menace") return run.menace;
      if (k === "honor") return run.honor;
      if (run.tracks[k] !== undefined) return run.tracks[k];
      return 0;
    }
    if (v.has_flag) return !!run.wallet[flagName(v.has_flag)];
  }
  if (unknown) unknown.push(JSON.stringify(v).slice(0, 40));
  return v;
}

// A conditional value: {"if":[cond, value, cond, value, …, fallback]}
function evalIf(v) {
  if (!v || typeof v !== "object" || !Array.isArray(v["if"])) return v;
  var arr = v["if"];
  for (var i = 0; i + 1 < arr.length; i += 2) {
    if (evalCondition(arr[i])) return arr[i + 1];
  }
  return arr.length % 2 ? arr[arr.length - 1] : null;
}

function bump(obj, key, amount) {
  if (!key) return;
  obj[key] = (obj[key] || 0) + (Number(amount) || 0);
}

// Carry out one effect. Everything the run can model is applied; everything it
// can't is recorded verbatim as an ask — never dropped, never rewritten.
function applyEffect(e, log) {
  if (!e || !e.type) return;
  var p = effParams(e);
  switch (e.type) {
    case "SET_PLAYER_FLAG":
      if (p.value === false) { delete run.wallet[p.flag]; log.cleared.push(p.flag); }
      else if (!run.wallet[p.flag]) { run.wallet[p.flag] = true; log.gained.push(p.flag); }
      break;
    case "ADJUST_RESOURCE": bump(run.resources, p.resource, p.amount); log.lines.push(effectPhrase(e)); break;
    case "ADJUST_TRACK":    bump(run.tracks, p.track, p.amount);       log.lines.push(effectPhrase(e)); break;
    case "ADJUST_STANDING": bump(run.standing, p.faction, p.amount);   log.lines.push(effectPhrase(e)); break;
    case "ADJUST_HONOR":    run.honor  += Number(p.amount) || 0;       log.lines.push(effectPhrase(e)); break;
    case "ADJUST_MENACE":   run.menace += Number(p.amount) || 0;       log.lines.push(effectPhrase(e)); break;
    case "ADVANCE_QUEST":
      // Position is recorded, but beat order on the canvas comes from prereqs,
      // so this does not itself move the quest along. Coverage names the quests
      // that rely on it and have no prereq chain to fall back on.
      run.quests[p.questId] = { beatId: p.beatId, complete: false };
      owed(e, log, effectPhrase(e));
      break;
    case "COMPLETE_QUEST":
      run.quests[p.questId] = { beatId: null, complete: true };
      log.completed.push(p.questId);
      break;
    case "QUEUE_DEFERRED":
      run.deferred.push({
        due: run.round + (Number(p.delayRounds) || 0),
        effects: p.effects || [],
        from: log.source, note: e._note || ""
      });
      log.lines.push(effectPhrase(e));
      break;
    case "ROLL":
      var chance = Number(p.chance) || 0;
      if (p.chanceIfFlag && typeof p.chanceIfFlag === "object") {
        Object.keys(p.chanceIfFlag).forEach(function (f) {
          if (run.wallet[f]) chance = Number(p.chanceIfFlag[f]) || chance;
        });
      }
      var hit = Math.random() * 100 < chance;
      run.rolls.push({ chance: chance, hit: hit, source: log.source });
      log.lines.push("rolled " + chance + "% → " + (hit ? "success" : "failure"));
      (hit ? (p.onSuccess || []) : (p.onFail || [])).forEach(function (s) { applyEffect(s, log); });
      break;
    case "CONTEST":
      // No unit model here, so the run asks the designer which branch to walk.
      log.pending.push({ kind: "contest", effect: e });
      break;
    case "FORCE_CHOICE":
      log.pending.push({ kind: "force", effect: e });
      break;
    case "PEEK":
      owed(e, log, effectPhrase(e));
      break;
    case "DELIVER_ENCOUNTER":
      // The spawn mechanism: this is how the engine puts a new card in front of
      // a player mid-session. The walk has no deck to put it in, so it says so
      // rather than pretending the card arrived.
      owed(e, log, "delivers " + (p.encounterId || p.id || "an encounter"));
      break;
    default:
      // Preserved exactly as authored, surfaced as something the engine owes.
      run.asks.push({ type: e.type, id: e.id || "", params: p, note: e._note || "", source: log.source });
      log.asks.push({ type: e.type, phrase: effectPhrase(e), note: e._note || "" });
  }
}

// Say the thing plainly and book it as something the engine still owes, so it
// shows up in the walk and in Systems instead of reading as though it ran.
function owed(e, log, phrase) {
  log.lines.push(phrase);
  run.asks.push({ type: e.type, id: e.id || "", params: effParams(e),
                  note: e._note || "", source: log.source });
  log.asks.push({ type: e.type, phrase: phrase, note: e._note || "" });
}

function newLog(source) {
  return { source: source, gained: [], cleared: [], completed: [], lines: [], asks: [], pending: [] };
}

function applyEffects(effects, log) {
  (effects || []).forEach(function (e) { applyEffect(e, log); });
  return log;
}

// Deferred effects land when their round arrives.
function advanceRound(log) {
  run.round += 1;
  var due = run.deferred.filter(function (d) { return d.due <= run.round; });
  run.deferred = run.deferred.filter(function (d) { return d.due > run.round; });
  due.forEach(function (d) { applyEffects(d.effects, log); });
  return due.length;
}

// A beat is in the pool only once its prereqs are met and its quest has
// reached it; encounters answer their own trigger condition.
function beatReady(n) {
  if (n._kind !== "beat") {
    var eng = n.engine;
    if (eng && eng.triggerCondition) return evalCondition(eng.triggerCondition);
    return true;
  }
  var unmet = (n.prereqs || []).some(function (p) { return !run.visited[p]; });
  if (unmet) return false;
  var q = run.quests[n._questId];
  if (q && q.complete) return false;
  if (n.deliver === "conditional" && n.engine && n.engine.deliverCondition) {
    return evalCondition(n.engine.deliverCondition);
  }
  return true;
}

function mentions(text, flag) {
  // Flags are snake_case; match on a whole token so `found_water` doesn't
  // match inside `found_water_deep`.
  var i = String(text).indexOf(flag);
  while (i !== -1) {
    var before = i === 0 ? "" : text.charAt(i - 1);
    var after = text.charAt(i + flag.length);
    if (!/[A-Za-z0-9_]/.test(before) && !/[A-Za-z0-9_]/.test(after)) return true;
    i = text.indexOf(flag, i + 1);
  }
  return false;
}

// What one choice grants and requires. Engine content states it outright in
// its effects and condition; hand-written content has it only in the fx prose,
// so that gets read instead.
function readChoice(enc, choice, encGrantsAll) {
  if (choice.engine) {
    return {
      engine: true,
      grants: flagsSetBy(choice.engine.effects),
      needs: flagsReadBy(choice.engine.condition),
      condition: choice.engine.condition || null,
      anyOf: false
    };
  }
  var fx = String(choice.fx || "");
  var grants = enc.out.filter(function (f) { return mentions(fx, f); });
  if (encGrantsAll) grants = enc.out.slice();
  var needs = enc["in"].filter(function (f) { return mentions(fx, f); });

  // "sets a OR b" is one outcome or the other, not both. Hand the fork to the
  // run to resolve rather than quietly granting everything named.
  var fork = null;
  if (grants.length > 1 && !encGrantsAll && orJoins(fx, grants)) {
    fork = grants.slice();
    grants = [];
  }
  return {
    grants: grants, fork: fork, needs: needs,
    anyOf: needs.length > 1 && splitsOnOr(fx)
  };
}

// Say plainly what the load repaired, and keep it out of the way after that.
function reportFlagRepairs() {
  if (!flagRepairs.length) return;
  var n = flagRepairs.length;
  commitSave();      // the board in memory is now the repaired one; make that durable
  toast(n + " flag name" + (n === 1 ? "" : "s") + " split into separate flags — see Coverage.", true);
}

// True when the fx text joins these flags with "or" rather than listing them.
// Checked on the span between each pair so "+1 Tech, sets a or b" forks on a|b
// while "sets a and b (or nothing)" does not.
function orJoins(fx, flags) {
  var at = flags.map(function (f) { return { f: f, i: String(fx).indexOf(f) }; })
    .filter(function (p) { return p.i !== -1; })
    .sort(function (a, b) { return a.i - b.i; });
  if (at.length < 2) return false;
  for (var i = 0; i < at.length - 1; i++) {
    var between = fx.slice(at[i].i + at[i].f.length, at[i + 1].i);
    if (!splitsOnOr(between)) return false;
  }
  return true;
}

// If no choice names any out-flag, the encounter grants them however it ends.
function grantsAll(enc) {
  if (!enc.out.length) return false;
  if (enc.choices.some(function (c) { return !!c.engine; })) return false;
  return !enc.choices.some(function (c) {
    return enc.out.some(function (f) { return mentions(String(c.fx || ""), f); });
  });
}

function choiceLocked(read, wallet) {
  if (read.engine) {
    if (!read.condition) return null;
    if (evalCondition(read.condition)) return null;
    var missing = read.needs.filter(function (f) { return !wallet[f]; });
    return missing.length ? missing : [conditionPhrase(read.condition)];
  }
  if (!read.needs.length) return null;
  var missing = read.needs.filter(function (f) { return !wallet[f]; });
  if (!missing.length) return null;
  if (read.anyOf && missing.length < read.needs.length) return null;   // OR satisfied
  return missing;
}

// scope:"gated" means faction-restricted at spawn.
function gatedOut(enc) {
  return enc.scope === "gated" && enc.faction !== "none" &&
         run.faction !== "any" && enc.faction !== run.faction;
}

function playable() {
  return allNodes().filter(function (e) {
    return !run.visited[e.id] && !gatedOut(e) && beatReady(e);
  });
}

function pickTitle(e) {
  if (e._kind !== "beat") return e.title;
  var q = getQuest(e._questId);
  return q ? q.title : e.title;
}

function unlockReason(enc) {
  var held = (enc["in"] || []).filter(function (f) { return run.wallet[f]; });
  if (enc._kind === "beat" && (enc.prereqs || []).length) {
    var prev = getNode(enc.prereqs[0]);
    return ["continues after " + (prev ? "beat " + ((prev._ordinal || 0) + 1) : "its prereq")]
      .concat(held.map(function (f) { return "holds " + f; }));
  }
  if (!held.length) return null;
  return held.map(function (f) { return "holds " + f; });
}

function openPlay() {
  closePanel();
  closeModal();
  select(null);
  if (!allNodes().length) { toast("Nothing to walk — the board is empty.", true); return; }
  run = newRunState("any");
  playEl.hidden = false;
  renderPlay();
}

function exitPlay(force) {
  if (!force && run && run.path.length && run.phase !== "summary") {
    if (!window.confirm("Leave this walk? The summary is only shown at the end.")) return;
  }
  run = null;
  playEl.hidden = true;
  clear(playEl);
}

function playStage(headKids, bodyKids, footKids) {
  clear(playEl);
  var stage = el("div", { class: "play-stage", role: "dialog", "aria-modal": "true" }, [
    el("div", { class: "play-head" }, headKids),
    el("div", { class: "play-body" }, bodyKids),
    el("div", { class: "play-foot" }, footKids)
  ]);
  playEl.appendChild(stage);
  var body = stage.querySelector(".play-body");
  if (body) body.scrollTop = 0;
  return stage;
}

function ledgerParts() {
  var parts = [];
  Object.keys(run.resources).forEach(function (k) {
    if (run.resources[k]) parts.push(k + " " + SIGN(run.resources[k]));
  });
  Object.keys(run.tracks).forEach(function (k) {
    if (run.tracks[k]) parts.push(k + " " + SIGN(run.tracks[k]));
  });
  if (run.honor) parts.push("honor " + SIGN(run.honor));
  if (run.menace) parts.push("menace " + SIGN(run.menace));
  Object.keys(run.standing).forEach(function (k) {
    if (run.standing[k]) parts.push(factionLabel(k) + " " + SIGN(run.standing[k]));
  });
  return parts;
}

function playHead() {
  var flags = Object.keys(run.wallet).length;
  var head = el("div", {}, [
    el("div", { class: "play-track" }, [
      el("span", { text: "Walk · " }),
      el("b", { text: "turn " + run.turn }),
      el("span", { text: " · round " + run.round }),
      el("span", { text: " · " + (run.faction === "any" ? "no faction" : factionLabel(run.faction)) }),
      el("span", { text: " · " }),
      el("b", { text: flags + " flag" + (flags === 1 ? "" : "s") }),
      run.deferred.length ? el("span", { text: " · " + run.deferred.length + " deferred" }) : null
    ])
  ]);
  var parts = ledgerParts();
  if (parts.length) head.appendChild(el("div", { class: "play-ledger", text: parts.join("  ·  ") }));
  return [
    head,
    el("button", { class: "btn ghost", text: "Exit", on: { click: function () { exitPlay(false); } } })
  ];
}

function walletChips() {
  var flags = Object.keys(run.wallet).sort();
  if (!flags.length) return el("div", { class: "play-quiet", text: "no flags yet" });
  return el("div", { class: "chips" }, flags.map(function (f) {
    return el("span", { class: "chip have", text: f });
  }));
}

function renderPlay() {
  if (!run) return;
  if (run.phase === "setup") return renderPlaySetup();
  if (run.phase === "encounter") return renderPlayEncounter();
  if (run.phase === "pending") return renderPlayPending();
  if (run.phase === "result") return renderPlayResult();
  if (run.phase === "next") return renderPlayNext();
  if (run.phase === "summary") return renderPlaySummary();
}

function renderPlaySetup() {
  var counts = {};
  allNodes().forEach(function (e) { counts[e.faction] = (counts[e.faction] || 0) + 1; });
  var options = [["any", "No faction — nothing is gated out"]].concat(
    Object.keys(FACTIONS).filter(function (k) { return k !== "none"; })
      .map(function (k) { return [k, FACTIONS[k].label]; })
  );
  var sel = selectEl(run.faction, options, function (v) { run.faction = v; });

  playStage(
    [el("div", { class: "play-track" }, [el("b", { text: "Thread walk" })]),
     el("button", { class: "btn ghost", text: "Exit", on: { click: function () { exitPlay(true); } } })],
    [
      el("div", { class: "play-eyebrow", text: "Set up the walk" }),
      el("h2", { class: "play-title", text: "Follow a thread through the board" }),
      el("p", { class: "play-hook",
        text: "Pick an encounter, take a choice, and carry the flags it sets forward. " +
              "Encounters your new flags reach are surfaced first, so a thread can be followed " +
              "end to end. Nothing you do here changes the board." }),
      el("p", { class: "play-quiet",
        text: "This is not a session. The engine deals a different board each time — decks, " +
              "copies, draw weights and where a card can land — and none of that is modelled " +
              "here; every card sits in one flat pool. So a card you do not meet on this walk " +
              "is not a card a player would miss. For that question, use Coverage → Unreachable, " +
              "which asks it of every walk at once." }),
      el("label", { class: "dr-field", style: { display: "block", maxWidth: "320px" } }, [
        el("div", { class: "play-eyebrow", text: "Playing as" }), sel
      ]),
      el("p", { class: "play-quiet",
        text: "Faction only affects encounters marked gated — those spawn for their own faction. " +
              allNodes().filter(function (e) { return e.scope === "gated"; }).length +
              " encounter(s) on this board are gated." })
    ],
    [
      el("span", { class: "play-quiet", text: allNodes().length + " cards on the board" }),
      el("button", { class: "btn primary", text: "Begin", on: { click: function () {
        run.phase = "next";
        renderPlay();
      } } })
    ]
  );
}

function renderPlayEncounter() {
  var enc = getNode(run.current);
  if (!enc) { run.phase = "next"; return renderPlay(); }
  var all = grantsAll(enc);
  var col = factionColor(enc.faction);

  var body = [
    el("div", { class: "play-eyebrow",
      text: enc._kind === "beat"
        ? (getQuest(enc._questId) ? getQuest(enc._questId).title : "Quest")
        : "Encounter " + run.turn }),
    el("h2", { class: "play-title", text: enc.title }),
    el("div", { class: "play-sub" }, [
      el("span", { class: "spine", style: { background: col } }),
      el("span", { text: (enc._kind === "beat"
                    ? "beat " + ((enc._ordinal || 0) + 1) + " · delivered " + (enc.deliver || "auto")
                    : typeLabel(enc.type)) + " · " + factionLabel(enc.faction) +
                          (enc.scope === "gated" ? " · gated" : "") })
    ]),
    el("p", { class: "play-hook", text: enc.hook || "(no hook written yet)" })
  ];
  if (enc.teaches) {
    body.push(el("p", { class: "play-teaches" }, [
      el("b", { text: "teaches" }), el("span", { text: enc.teaches })
    ]));
  }

  if (!enc.choices.length) {
    body.push(el("div", { class: "play-quiet", text: "This encounter has no choices written yet." }));
  }

  enc.choices.forEach(function (c, i) {
    var read = readChoice(enc, c, all);
    var missing = choiceLocked(read, run.wallet);
    var chips = [];
    read.grants.forEach(function (f) { chips.push(el("span", { class: "chip gain", text: "sets " + f })); });
    if (read.fork) {
      chips.push(el("span", { class: "chip fork", text: "sets " + read.fork.join(" or ") + " — you pick" }));
    }
    if (missing) {
      chips.push(el("span", { class: "chip need",
        text: "needs " + missing.join(read.anyOf ? " or " : " + ") }));
    } else if (read.needs.length) {
      chips.push(el("span", { class: "chip have", text: "unlocked by " + read.needs.join(" / ") }));
    }
    if (!read.grants.length && !read.fork && !missing) {
      chips.push(el("span", { class: "chip plain", text: "sets nothing" }));
    }

    body.push(el("button", {
      class: "choice-btn" + (missing ? " locked" : ""),
      disabled: !!missing,
      on: { click: function () { if (!missing) takeChoice(enc, i, read); } }
    }, [
      el("div", {}, [
        el("span", { class: "choice-key", text: String(i + 1) }),
        el("span", { class: "choice-lbl", text: c.label || "(unlabelled choice)" })
      ]),
      el("div", { class: "choice-fx", text: c.fx || "—" }),
      chips.length ? el("div", { class: "chips" }, chips) : null
    ]));

    if (missing) {
      run.lockedSeen.push({ enc: enc.title, choice: c.label || "(unlabelled)", missing: missing.slice() });
    }
  });

  playStage(playHead(), body, [
    el("span", { class: "play-quiet kbd-hint", text: "press 1–9 to choose" }),
    el("button", { class: "btn ghost", text: "Skip this one", on: { click: function () {
      run.visited[enc.id] = true;
      run.path.push({ id: enc.id, title: enc.title, choice: null, gained: [] });
      run.phase = "next";
      renderPlay();
    } } })
  ]);
}

function takeChoice(enc, i, read) {
  var choice = enc.choices[i];
  var log = newLog(enc.title + " · " + (choice.label || "choice " + (i + 1)));

  if (read.engine) {
    applyEffects(choice.engine.effects, log);          // the authored effects, run for real
  } else {
    read.grants.forEach(function (f) {
      if (!run.wallet[f]) { run.wallet[f] = true; log.gained.push(f); }
    });
    // "sets a OR b" — the run picks one rather than taking both.
    if (read.fork) log.pending.push({ kind: "flagfork", flags: read.fork.slice() });
  }

  run.visited[enc.id] = true;
  run.path.push({
    id: enc.id, title: enc.title,
    choice: choice.label || "(unlabelled)",
    fx: choice.fx || "",
    gained: log.gained.slice(),
    outcomeText: choice.engine ? choice.engine.outcomeText : ""
  });

  if (log.pending.length) {                            // a branch the run can't decide alone
    run.pending = { log: log, enc: enc, queue: log.pending.slice() };
    log.pending = [];
    run.phase = "pending";
    renderPlay();
    return;
  }
  finishChoice(log, enc);
}

// Rounds tick per encounter played, which is what makes QUEUE_DEFERRED land.
function finishChoice(log, enc) {
  var landed = advanceRound(log);
  run.lastGain = {
    enc: enc, log: log, gained: log.gained, opened: opensNow(log.gained), deferredLanded: landed
  };
  run.pending = null;
  run.phase = "result";
  renderPlay();
}

function renderPlayPending() {
  var pend = run.pending;
  var item = pend.queue[0];

  // An either/or written into the fx prose: one of these flags, not all.
  if (item.kind === "flagfork") {
    var forkBody = [
      el("div", { class: "play-eyebrow", text: "This outcome forks" }),
      el("h2", { class: "play-title", text: "One or the other" }),
      el("p", { class: "play-hook",
        text: "The effect is written as an either/or, so the walk takes one of these — not both. " +
              "Pick the branch you want to walk." })
    ];
    item.flags.forEach(function (f) {
      forkBody.push(el("button", { class: "choice-btn", on: { click: function () {
        if (!run.wallet[f]) { run.wallet[f] = true; pend.log.gained.push(f); }
        stepPending();
      } } }, [
        el("div", {}, [el("span", { class: "choice-lbl mono", text: f })]),
        el("div", { class: "choice-fx", text: "carries " + f + " forward; the others are not set" })
      ]));
    });
    playStage(playHead(), forkBody, [
      el("span", { class: "play-quiet", text: "written as “" + item.flags.join(" or ") + "”" })
    ]);
    return;
  }

  var p = effParams(item.effect);
  var body = [el("div", { class: "play-eyebrow", text: "The engine needs a result" })];

  if (item.kind === "contest") {
    body.push(el("h2", { class: "play-title", text: "Contest" }));
    body.push(el("p", { class: "play-hook",
      text: "This choice runs a contest against strength " + p.opponentStrength +
            (p.allyStrength ? " with allies at " + p.allyStrength : "") +
            ". The run has no unit model, so pick the branch you want to walk." }));
    [["Win", p.onWin], ["Lose", p.onLose]].forEach(function (opt) {
      body.push(el("button", { class: "choice-btn", on: { click: function () {
        applyEffects(opt[1] || [], pend.log);
        stepPending();
      } } }, [
        el("div", {}, [el("span", { class: "choice-lbl", text: opt[0] })]),
        el("div", { class: "choice-fx", text: (opt[1] || []).map(effectPhrase).join(" · ") || "—" })
      ]));
    });
  } else {
    body.push(el("h2", { class: "play-title", text: "Forced choice" }));
    body.push(el("p", { class: "play-hook", text: "The effect forces a further choice." }));
    (p.options || []).forEach(function (o) {
      body.push(el("button", { class: "choice-btn", on: { click: function () {
        applyEffects(o.effects || [], pend.log);
        stepPending();
      } } }, [
        el("div", {}, [el("span", { class: "choice-lbl", text: o.label || "(unlabelled)" })]),
        el("div", { class: "choice-fx", text: (o.effects || []).map(effectPhrase).join(" · ") || "—" })
      ]));
    });
  }

  playStage(playHead(), body, [
    el("span", { class: "play-quiet", text: "authored as " + item.effect.type })
  ]);
}

function stepPending() {
  var pend = run.pending;
  pend.queue.shift();
  if (pend.log.pending.length) {          // a nested effect forced another branch
    pend.queue = pend.queue.concat(pend.log.pending);
    pend.log.pending = [];
  }
  if (pend.queue.length) { renderPlay(); return; }
  finishChoice(pend.log, pend.enc);
}

// Which unvisited encounters those new flags just reached.
function opensNow(gained) {
  if (!gained.length) return [];
  return playable().filter(function (e) {
    return e["in"].some(function (f) { return gained.indexOf(f) !== -1; });
  });
}

function renderPlayResult() {
  var g = run.lastGain;
  var log = g.log || newLog("");
  var body = [];

  // What the player is told, when the content says it.
  var last = run.path[run.path.length - 1];
  if (last && last.outcomeText) {
    body.push(el("p", { class: "play-hook", text: last.outcomeText }));
  }

  if (log.lines.length) {
    body.push(el("div", { class: "pick-h", text: "effects applied" }));
    body.push(el("div", { class: "play-quiet", style: { marginBottom: ".7rem" },
      text: log.lines.join(" · ") }));
  }

  if (log.completed.length) {
    body.push(el("div", { class: "pick-h unlocked", text: "quest complete" }));
    body.push(el("div", { class: "chips", style: { marginBottom: ".7rem" } },
      log.completed.map(function (q) {
        var quest = getQuest(q);
        return el("span", { class: "chip have", text: quest ? quest.title : q });
      })));
  }

  // Engine calls the run can't carry out: shown, with the author's own note.
  if (log.asks.length) {
    body.push(el("div", { class: "pick-h", text: "the engine would" }));
    log.asks.forEach(function (a) {
      body.push(el("div", { class: "sum-note" }, [
        el("b", { text: a.type }),
        el("span", { text: " — " + a.phrase }),
        a.note ? el("span", { class: "ask-note", text: " " + a.note }) : null
      ]));
    });
  }

  if (g.deferredLanded) {
    body.push(el("div", { class: "play-quiet", style: { marginBottom: ".7rem" },
      text: g.deferredLanded + " deferred effect" + (g.deferredLanded === 1 ? "" : "s") +
            " landed this round." }));
  }

  if (g.gained.length) {
    body.push(el("div", { class: "play-gained" }, [
      el("div", { class: "lbl", text: "flags gained" }),
      el("div", { class: "chips" }, g.gained.map(function (f) {
        return el("span", { class: "chip gain", text: f });
      }))
    ]));
  } else {
    body.push(el("div", { class: "play-gained" }, [
      el("div", { class: "lbl", text: "no flags gained" }),
      el("div", { class: "play-quiet", style: { marginTop: ".3rem" },
        text: "That choice sets nothing the board can follow — worth checking if it should." })
    ]));
  }

  if (g.opened.length) {
    body.push(el("div", { class: "pick-h unlocked", text: "that opened" }));
    g.opened.forEach(function (e) {
      body.push(el("div", { class: "pick-item", style: { borderLeftColor: factionColor(e.faction), cursor: "default" } }, [
        el("div", { class: "pick-body" }, [
          el("span", { class: "pick-title", text: e.title }),
          el("span", { class: "pick-meta", text: typeLabel(e.type) + " · " + factionLabel(e.faction) })
        ])
      ]));
    });
  }

  body.push(el("div", { class: "pick-h", text: "flags in hand" }));
  body.push(walletChips());

  playStage(playHead(), body, [
    el("span", { class: "play-quiet kbd-hint", text: "press Enter to continue" }),
    el("button", { class: "btn primary", text: "Continue", on: { click: function () {
      run.phase = "next";
      renderPlay();
    } } })
  ]);
}

function renderPlayNext() {
  var pool = playable();
  if (!pool.length) { run.phase = "summary"; return renderPlay(); }

  var unlocked = [], rest = [];
  pool.forEach(function (e) {
    var why = unlockReason(e);
    (why ? unlocked : rest).push({ e: e, why: why });
  });
  var byTitle = function (a, b) { return a.e.title.localeCompare(b.e.title); };
  unlocked.sort(byTitle);
  rest.sort(function (a, b) {
    if (a.e.type !== b.e.type) return a.e.type.localeCompare(b.e.type);
    return byTitle(a, b);
  });

  function item(row) {
    return el("button", {
      class: "pick-item",
      style: { borderLeftColor: factionColor(row.e.faction) },
      on: { click: function () {
        run.current = row.e.id;
        run.turn += 1;
        run.phase = "encounter";
        renderPlay();
      } }
    }, [
      el("div", { class: "pick-body" }, [
        el("span", { class: "pick-title", text: pickTitle(row.e) }),
        el("span", { class: "pick-meta",
          text: (row.e._kind === "beat"
                  ? "beat " + ((row.e._ordinal || 0) + 1) + " · " + (row.e.deliver || "auto")
                  : typeLabel(row.e.type)) + " · " + factionLabel(row.e.faction) +
                (row.e.out.length ? " · sets " + row.e.out.length : "") })
      ]),
      row.why ? el("span", { class: "pick-why", text: row.why.join(", ") }) : null
    ]);
  }

  var body = [];
  if (!run.turn) {
    body.push(el("div", { class: "play-eyebrow", text: "Where does the walk begin?" }));
  }
  if (unlocked.length) {
    body.push(el("div", { class: "pick-h unlocked",
      text: "your flags reach these (" + unlocked.length + ")" }));
    unlocked.forEach(function (r) { body.push(item(r)); });
  }
  body.push(el("div", { class: "pick-h",
    text: (unlocked.length ? "everything else " : "available ") + "(" + rest.length + ")" }));
  if (rest.length) rest.forEach(function (r) { body.push(item(r)); });
  else body.push(el("div", { class: "play-quiet", text: "nothing else open from here" }));

  if (Object.keys(run.wallet).length) {
    body.push(el("div", { class: "pick-h", text: "flags in hand" }));
    body.push(walletChips());
  }

  playStage(playHead(), body, [
    el("span", { class: "play-quiet",
      text: run.path.length + " walked · " + pool.length + " open from here" }),
    el("button", { class: "btn", text: "End walk", on: { click: function () {
      run.phase = "summary";
      renderPlay();
    } } })
  ]);
}

function renderPlaySummary() {
  var body = [];
  var held = Object.keys(run.wallet).sort();

  body.push(el("div", { class: "play-eyebrow", text: "Walk summary" }));
  body.push(el("h2", { class: "play-title",
    text: run.path.length + " encounter" + (run.path.length === 1 ? "" : "s") + " walked" }));

  if (run.path.length) {
    body.push(el("div", { class: "sum-h", text: "the path" }));
    run.path.forEach(function (step, i) {
      body.push(el("div", { class: "sum-step" }, [
        el("span", { class: "num", text: String(i + 1) }),
        el("span", { class: "what" }, [
          el("span", { text: step.title }),
          el("span", { class: "took" }, step.choice
            ? [el("span", { text: "→ " + step.choice + (step.gained.length ? "  " : "") }),
               step.gained.length ? el("i", { text: "+" + step.gained.join(", +") }) : null]
            : [el("span", { text: "→ skipped" })])
        ])
      ]));
    });
  }

  body.push(el("div", { class: "sum-h", text: "flags held (" + held.length + ")" }));
  body.push(held.length
    ? el("div", { class: "chips" }, held.map(function (f) { return el("span", { class: "chip have", text: f }); }))
    : el("div", { class: "play-quiet", text: "none" }));

  // Everything the board can set, that this run never picked up.
  var allOut = uniq(allNodes().reduce(function (a, e) { return a.concat(e.out); }, [])).sort();
  var obtainable = reach().flags;
  var missed = allOut.filter(function (f) { return !run.wallet[f]; });
  var neverAny = missed.filter(function (f) { return !obtainable[f]; });
  body.push(el("div", { class: "sum-h", text: "flags this walk never picked up (" + missed.length + ")" }));
  body.push(missed.length
    ? el("div", { class: "chips" }, missed.map(function (f) {
        return el("span", { class: "chip " + (obtainable[f] ? "plain" : "gone"),
                            title: obtainable[f] ? "another walk could pick this up"
                                                 : "no walk can pick this up", text: f });
      }))
    : el("div", { class: "play-quiet", text: "none \u2014 this walk touched every flag on the board" }));
  if (neverAny.length) {
    body.push(el("div", { class: "play-quiet",
      text: neverAny.length + " of those are out of reach on every walk, not just this one \u2014 " +
            "nothing on the board sets them." }));
  }

  var gated = allNodes().filter(function (e) {
    return !run.visited[e.id] && e.scope === "gated" && e.faction !== "none" &&
           run.faction !== "any" && e.faction !== run.faction;
  });
  if (gated.length) {
    body.push(el("div", { class: "sum-h", text: "gated out by faction (" + gated.length + ")" }));
    gated.forEach(function (e) {
      body.push(el("div", { class: "sum-note" }, [
        el("b", { text: e.title }), el("span", { text: " — spawns for " + factionLabel(e.faction) })
      ]));
    });
  }

  // Two very different things used to share this list. A card you simply did
  // not pick is not a finding -- one walk is one path, and the engine deals a
  // fresh board each session anyway. A card no walk can open is.
  var r = reach();
  var unvisited = allNodes().filter(function (e) {
    return !run.visited[e.id] && gated.indexOf(e) === -1;
  });
  var blocked = unvisited.filter(function (e) { return !r.reached[e.id]; });
  var skipped = unvisited.filter(function (e) { return r.reached[e.id]; });

  body.push(el("div", { class: "sum-h", text: "blocked \u00b7 no walk opens these (" + blocked.length + ")" }));
  if (blocked.length) {
    var whyBy = {};
    r.unreachable.forEach(function (u) { whyBy[u.node.id] = u.why; });
    blocked.forEach(function (e) {
      body.push(el("div", { class: "sum-note" }, [
        el("b", { text: nodeLabel(e) }),
        el("span", { text: " \u2014 " + ((whyBy[e.id] || {}).text || "nothing opens it") })
      ]));
    });
  } else {
    body.push(el("div", { class: "play-quiet",
      text: "none \u2014 everything you did not see, some other walk could reach" }));
  }

  body.push(el("div", { class: "sum-h", text: "not on this walk (" + skipped.length + ")" }));
  body.push(skipped.length
    ? el("div", { class: "chips" }, skipped.map(function (e) {
        return el("span", { class: "chip plain", text: pickTitle(e) });
      }))
    : el("div", { class: "play-quiet", text: "this walk covered everything open to it" }));
  if (skipped.length) {
    body.push(el("div", { class: "play-quiet",
      text: "These were open and simply not taken \u2014 a different walk, or a different board, " +
            "reaches them. Coverage keeps the standing answer." }));
  }

  // Authoring findings the walk turned up.
  var locked = {};
  run.lockedSeen.forEach(function (l) { locked[l.enc + " · " + l.choice] = l; });
  var lockedList = Object.keys(locked);
  if (lockedList.length) {
    body.push(el("div", { class: "sum-h", text: "choices you couldn't take (" + lockedList.length + ")" }));
    lockedList.forEach(function (k) {
      body.push(el("div", { class: "sum-note" }, [
        el("b", { text: locked[k].enc + " · " + locked[k].choice }),
        el("span", { text: " — needs " + locked[k].missing.join(", ") })
      ]));
    });
  }

  var unreachable = [];
  allNodes().forEach(function (e) {
    if (grantsAll(e) || !e.out.length) return;
    e.out.forEach(function (f) {
      var reachable = e.choices.some(function (c) { return mentions(String(c.fx || ""), f); });
      if (!reachable) unreachable.push({ enc: e.title, flag: f });
    });
  });
  if (unreachable.length) {
    body.push(el("div", { class: "sum-h", text: "flags no choice sets (" + unreachable.length + ")" }));
    body.push(el("div", { class: "play-quiet",
      text: "Other choices in these encounters name a flag, so the walk reads them as choice-specific — " +
            "but nothing sets these, which means no player can ever get them." }));
    unreachable.forEach(function (u) {
      body.push(el("div", { class: "sum-note" }, [
        el("b", { text: u.flag }), el("span", { text: " — in " + u.enc })
      ]));
    });
  }

  playStage(
    [el("div", { class: "play-track" }, [el("b", { text: "Thread walk · done" })]),
     el("button", { class: "btn ghost", text: "Close", on: { click: function () { exitPlay(true); } } })],
    body,
    [
      el("button", { class: "btn ghost", text: "Walk again", on: { click: function () {
        var f = run.faction;
        run = newRunState(f);
        run.phase = "next";
        renderPlay();
      } } }),
      el("button", { class: "btn primary", text: "Back to the board", on: { click: function () { exitPlay(true); } } })
    ]
  );
}

function playKey(ev) {
  if (!run || playEl.hidden) return;
  if (ev.key === "Escape") { ev.preventDefault(); exitPlay(false); return; }
  if (run.phase === "encounter" && /^[1-9]$/.test(ev.key)) {
    var i = parseInt(ev.key, 10) - 1;
    var enc = getNode(run.current);
    if (!enc || !enc.choices[i]) return;
    var read = readChoice(enc, enc.choices[i], grantsAll(enc));
    if (choiceLocked(read, run.wallet)) return;
    ev.preventDefault();
    takeChoice(enc, i, read);
  } else if (run.phase === "result" && ev.key === "Enter") {
    ev.preventDefault();
    run.phase = "next";
    renderPlay();
  }
}

/* ── search & color-by ────────────────────────────────────────────────── */

var searchTimer = null;
function setSearch(v) {
  search = v;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () { renderGeometry(); }, 90);
}
function setColorBy(v) {
  colorBy = v;
  $("#btn-color-faction").className = "segbtn" + (v === "faction" ? " on" : "");
  $("#btn-color-status").className = "segbtn" + (v === "status" ? " on" : "");
  renderGeometry();
  if (panel === "legend") renderLegend();
}

/* ── wiring ───────────────────────────────────────────────────────────── */

function measureBar() {
  barH = bar.offsetHeight || 60;
  document.documentElement.style.setProperty("--barH", barH + "px");
}

$("#btn-add").addEventListener("click", function () { closePanel(); addEncounter(); });
$("#btn-connect").addEventListener("click", function () {
  closePanel();
  setConnectFrom(null);
  setMode(mode === "connect" ? null : "connect");
});
$("#btn-zin").addEventListener("click", function () { zoomBy(1.25); });
$("#btn-zout").addEventListener("click", function () { zoomBy(0.8); });
$("#btn-fit").addEventListener("click", function () { fit(); });
$("#btn-tidy").addEventListener("click", function () { closePanel(); tidy(); });
$("#btn-legend").addEventListener("click", function () { togglePanel("legend"); });
$("#btn-coverage").addEventListener("click", function () { togglePanel("coverage"); });
$("#btn-systems").addEventListener("click", function () { togglePanel("systems"); });
$("#btn-board").addEventListener("click", function () { togglePanel("menu"); });
$("#btn-color-faction").addEventListener("click", function () { setColorBy("faction"); });
$("#btn-color-status").addEventListener("click", function () { setColorBy("status"); });
$("#btn-export").addEventListener("click", openExport);
$("#btn-import").addEventListener("click", openImport);
$("#search").addEventListener("input", function (ev) { setSearch(ev.target.value); });

canvas.addEventListener("pointerdown", onBgDown);
canvas.addEventListener("wheel", onWheel, { passive: false });
window.addEventListener("pointermove", onGlobalMove);
window.addEventListener("pointerup", onGlobalUp);
window.addEventListener("pointercancel", onGlobalUp);
window.addEventListener("resize", function () { measureBar(); });
$("#btn-play").addEventListener("click", openPlay);
window.addEventListener("keydown", function (ev) {
  if (run && !playEl.hidden) { playKey(ev); return; }   // the run owns the keyboard
  if (ev.key === "Escape") {
    if (!modalEl.hidden) { closeModal(); return; }
    if (panel) { closePanel(); return; }
    if (mode === "connect") { setConnectFrom(null); setMode(null); return; }
    if (selectedId) select(null);
  }
});
// A file dropped anywhere but the import target would otherwise navigate away.
["dragover", "drop"].forEach(function (t) {
  window.addEventListener(t, function (ev) {
    if (modalEl.contains(ev.target)) return;
    ev.preventDefault();
    if (t === "drop" && ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
      toast("Open Import first, then drop the file there.");
    }
  });
});
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") commitSave();
});
window.addEventListener("pagehide", commitSave);

try {
  var ro = new ResizeObserver(measureBar);
  ro.observe(bar);
} catch (e) { /* older browsers: the resize listener covers it */ }

/* ── boot ─────────────────────────────────────────────────────────────── */

measureBar();
setColorBy("faction");
setMode(null);

Store.load().then(function (saved) {
  var b = saved ? normalizeBoard(saved) : null;
  if (!b || !b.encounters.length) b = normalizeBoard({ encounters: SEED });
  board = b;
  placeMissingInPlace();
  syncIndex();
  separateInPlace(null);
  loaded = true;
  renderCanvas();
  renderDrawer();
  reportFlagRepairs();
  setTimeout(function () { fit(window.innerWidth <= 620 ? 0.6 : 0); }, 60);
  if (!saved) commitSave();
});

})();
</script>
</body>
</html>
