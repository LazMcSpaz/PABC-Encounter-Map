var nodeList = [];

function getNode(id) { return nodeIndex[id] || null; }
function getQuest(id) {
  var q = null;
  (board.quests || []).forEach(function (x) { if (x && x.id === id) q = x; });
  return q;
}

// Encounters and quest beats share one node space: both sit on the canvas, both
// carry out/in, so the flag graph, filters, search and the run treat them alike.
// Beats keep their quest membership on _questId and serialize back to the §7
// quest shape on export.
function allNodes() { return nodeList; }

function syncIndex() {
  nodeIndex = {};
  nodeList = [];
  board.encounters.forEach(function (e) {
    e._kind = "encounter";
    nodeIndex[e.id] = e;
    nodeList.push(e);
  });
  (board.quests || []).forEach(function (q) {
    (q.beats || []).forEach(function (b, i) {
      b._kind = "beat";
      b._questId = q.id;
      b._ordinal = typeof b.ordinal === "number" ? b.ordinal : i;
      nodeIndex[b.id] = b;
      nodeList.push(b);
    });
  });
}

/* ── quests & beats ───────────────────────────────────────────────────── */

// Ordinal first, then prereqs as a tie-break, so a chain reads in play order
// even when ordinals are absent.
function questBeatsInOrder(q) {
  var beats = (q.beats || []).slice();
  beats.sort(function (a, b) {
    var ao = typeof a._ordinal === "number" ? a._ordinal : 0;
    var bo = typeof b._ordinal === "number" ? b._ordinal : 0;
    if (ao !== bo) return ao - bo;
    if ((a.prereqs || []).indexOf(b.id) !== -1) return 1;
    if ((b.prereqs || []).indexOf(a.id) !== -1) return -1;
    return 0;
  });
  return beats;
}

function prereqEdges() {
  var out = [];
  allNodes().forEach(function (n) {
    (n.prereqs || []).forEach(function (pid) {
      if (getNode(pid)) out.push({ from: pid, to: n.id });
    });
  });
  return out;
}

function questBox(q) {
  var members = (q.beats || []).filter(isVisible);
  if (!members.length) return null;
  var xs = members.map(function (m) { return m.x; }), ys = members.map(function (m) { return m.y; });
  var pad = 40;
  return {
    x: Math.min.apply(null, xs) - W / 2 - pad,
    y: Math.min.apply(null, ys) - H / 2 - pad - 14,
    w: (Math.max.apply(null, xs) - Math.min.apply(null, xs)) + W + pad * 2,
    h: (Math.max.apply(null, ys) - Math.min.apply(null, ys)) + H + pad * 2 + 14
  };
}

/* ── derived graph (never stored) ─────────────────────────────────────── */

function derive() {
  var producers = {}, consumers = {};
  allNodes().forEach(function (e) {
    e.out.forEach(function (f) { (producers[f] = producers[f] || []).push(e.id); });
    e["in"].forEach(function (f) { (consumers[f] = consumers[f] || []).push(e.id); });
  });
  var flagEdges = [];
  allNodes().forEach(function (src) {
    src.out.forEach(function (f) {
      (consumers[f] || []).forEach(function (tid) {
        if (tid !== src.id) flagEdges.push({ from: src.id, to: tid, flag: f });
      });
    });
  });
  var dangling = {}, openFlags = [];
  allNodes().forEach(function (e) {
    var d = e.out.filter(function (f) { return !(consumers[f] && consumers[f].length); });
    if (d.length) { dangling[e.id] = d; openFlags = openFlags.concat(d); }
  });
  var unmet = [];
  Object.keys(consumers).forEach(function (f) {
    if (!(producers[f] && producers[f].length)) unmet.push(f);
  });
  return {
    producers: producers, consumers: consumers, flagEdges: flagEdges,
    dangling: dangling, openFlags: uniq(openFlags).sort(), unmet: unmet.sort()
  };
}

function coverage() {
  var d = derived;
  var byFaction = {}, byType = {}, byStatus = {};
  Object.keys(FACTIONS).forEach(function (k) { byFaction[k] = 0; });
  Object.keys(TYPES).forEach(function (k) { byType[k] = 0; });
  Object.keys(STATUSES).forEach(function (k) { byStatus[k] = 0; });
  allNodes().forEach(function (e) {
    byFaction[e.faction] = (byFaction[e.faction] || 0) + 1;
    byType[e.type] = (byType[e.type] || 0) + 1;
    byStatus[e.status] = (byStatus[e.status] || 0) + 1;
  });
  var emptyPoles = Object.keys(byFaction).filter(function (k) { return !byFaction[k]; });
  var emptyTypes = Object.keys(byType).filter(function (k) { return !byType[k]; });
  return {
    byFaction: byFaction, byType: byType, byStatus: byStatus,
    emptyPoles: emptyPoles, emptyTypes: emptyTypes,
    open: d.openFlags, unmet: d.unmet, total: allNodes().length
  };
}

/* -- reachability: what any walk can reach ----------------------------- */

// A walk is one path through a board the engine lays out differently every
// session, so "I never saw it" says nothing on its own. This asks the
// map-independent question instead: is there ANY walk that arrives here?
// Every unknown is treated as satisfiable, so the analysis under-reports
// rather than crying wolf -- a node listed here is one that no placement and
// no run of luck can open.

var reachCache = null;
function reach() { return reachCache || (reachCache = reachability()); }

function nodeLabel(n) {
  if (!n) return "";
  if (n._kind !== "beat") return n.title;
  var q = getQuest(n._questId);
  return (q ? q.title : "quest") + " · beat " + ((n._ordinal || 0) + 1);
}

// Could this condition ever hold, given every flag the board can produce?
// Only the flag case is decided; numeric and unmodelled terms are assumed
// reachable, because nothing here can prove otherwise.
function satisfiable(cond, flags) {
  if (!cond || typeof cond !== "object") return true;
  if (cond.has_flag) { var f = flagName(cond.has_flag); return !f || !!flags[f]; }
  if (cond.all) return cond.all.every(function (x) { return satisfiable(x, flags); });
  if (cond.any) return cond.any.some(function (x) { return satisfiable(x, flags); });
  return true;   // not / op / count_flags / score / unrecognised
}

function missingFrom(cond, flags) {
  return flagsReadBy(cond).filter(function (f) { return !flags[f]; });
}

// What a choice needs before any walk can take it, and what it hands out.
// A fork counts as granting both sides: one walk takes each.
function choiceNeeds(n, c) {
  var read = readChoice(n, c, grantsAll(n));
  return { engine: !!read.engine, condition: read.condition || null,
           needs: read.needs || [], anyOf: !!read.anyOf,
           grants: (read.grants || []).concat(read.fork || []) };
}

function choiceOpenable(req, flags) {
  if (req.engine) return satisfiable(req.condition, flags);
  if (!req.needs.length) return true;
  return req.anyOf
    ? req.needs.some(function (f) { return flags[f]; })
    : req.needs.every(function (f) { return flags[f]; });
}

// Beats whose prereqs form a loop: each waits on another that is waiting on
// it, so the whole ring is dead no matter how the board is laid out.
function prereqCycles() {
  var state = {}, stack = [], out = [], seen = {};
  function visit(id) {
    var n = getNode(id);
    if (!n) return;
    if (state[id] === 1) {
      var at = stack.indexOf(id);
      if (at === -1) return;
      var ring = stack.slice(at);
      var key = ring.slice().sort().join("|");
      if (!seen[key]) { seen[key] = 1; out.push(ring); }
      return;
    }
    if (state[id] === 2) return;
    state[id] = 1; stack.push(id);
    (n.prereqs || []).forEach(visit);
    stack.pop(); state[id] = 2;
  }
  allNodes().forEach(function (n) { visit(n.id); });
  return out;
}

function reachability() {
  var nodes = allNodes();
  var onBoard = {};
  nodes.forEach(function (n) { onBoard[n.id] = n; });

  // A prereq pointing at a beat that is not on the board can never be
  // satisfied -- and it draws no edge, so the chain behind it simply never
  // appears, with nothing on screen to say why.
  var dangling = {};
  nodes.forEach(function (n) {
    var miss = (n.prereqs || []).filter(function (p) { return !onBoard[p]; });
    if (miss.length) dangling[n.id] = miss;
  });

  // Grow the reachable set and the obtainable-flag set together until neither
  // moves. Flags come only from choices a walk could actually take in nodes it
  // could actually enter, so content walled off behind a broken gate cannot
  // prop up the rest of the analysis.
  var reached = {}, flags = {};
  for (var pass = 0; pass < nodes.length + 2; pass++) {
    var moved = false;
    nodes.forEach(function (n) {
      if (reached[n.id] || dangling[n.id]) return;
      if (!(n.prereqs || []).every(function (p) { return reached[p]; })) return;
      var eng = n.engine || {};
      if (!satisfiable(eng.triggerCondition, flags)) return;
      if (n.deliver === "conditional" && !satisfiable(eng.deliverCondition, flags)) return;
      reached[n.id] = true; moved = true;
    });
    nodes.forEach(function (n) {
      if (!reached[n.id]) return;
      var all = grantsAll(n);
      var give = (all || !(n.choices || []).length) ? (n.out || []).slice() : [];
      (n.choices || []).forEach(function (c) {
        var req = choiceNeeds(n, c);
        if (choiceOpenable(req, flags)) give = give.concat(req.grants);
      });
      give.forEach(function (f) { if (f && !flags[f]) { flags[f] = true; moved = true; } });
    });
    if (!moved) break;
  }

  function why(n) {
    if (dangling[n.id]) {
      return { kind: "dangling",
               text: "prereq is not on the board: " + dangling[n.id].join(", ") };
    }
    var waiting = (n.prereqs || []).filter(function (p) { return !reached[p]; });
    if (waiting.length) {
      return { kind: "prereq", text: "waits on " +
        waiting.map(function (p) { return nodeLabel(getNode(p)) || p; }).join(", ") +
        ", which nothing opens" };
    }
    var eng = n.engine || {};
    var cond = !satisfiable(eng.triggerCondition, flags) ? eng.triggerCondition
             : (n.deliver === "conditional" && !satisfiable(eng.deliverCondition, flags))
               ? eng.deliverCondition : null;
    if (cond) {
      var miss = missingFrom(cond, flags);
      // When the unmet flags are the whole story, say only that: repeating the
      // condition back adds nothing but noise.
      if (miss.length && flagsReadBy(cond).length === miss.length) {
        return { kind: "condition", text: "nothing sets " + miss.join(", ") };
      }
      return { kind: "condition", text: "needs " + conditionPhrase(cond) +
        (miss.length ? " — nothing sets " + miss.join(", ") : "") };
    }
    return { kind: "cycle", text: "its prereqs form a loop" };
  }

  var unreachable = [];
  nodes.forEach(function (n) {
    if (!reached[n.id]) unreachable.push({ node: n, why: why(n) });
  });

  // Choices inside reachable content that no walk can ever unlock.
  var deadChoices = [];
  nodes.forEach(function (n) {
    if (!reached[n.id]) return;
    (n.choices || []).forEach(function (c) {
      var req = choiceNeeds(n, c);
      if (choiceOpenable(req, flags)) return;
      var miss = req.engine ? missingFrom(req.condition, flags)
                            : req.needs.filter(function (f) { return !flags[f]; });
      deadChoices.push({ node: n, label: c.label || "(unlabelled)", missing: miss,
                         phrase: req.engine ? conditionPhrase(req.condition) : "" });
    });
  });

  // A quest whose order lives in ADVANCE_QUEST effects rather than in
  // quest_beat_prereqs. Nothing holds the line, so every beat is on offer at
  // once -- the sequence exists only in the engine's head.
  var looseQuests = [];
  (board.quests || []).forEach(function (q) {
    var beats = q.beats || [];
    if (beats.length < 2) return;
    if (beats.some(function (b) { return (b.prereqs || []).length; })) return;
    var advances = false;
    beats.forEach(function (b) {
      (b.choices || []).forEach(function (c) {
        if (!c.engine) return;
        walkEffects(c.engine.effects, function (e) {
          if (e.type === "ADVANCE_QUEST") advances = true;
        });
      });
    });
    if (advances) looseQuests.push({ quest: q, beats: beats.length });
  });

  return {
    reached: reached, flags: flags, unreachable: unreachable,
    deadChoices: deadChoices, cycles: prereqCycles(), looseQuests: looseQuests,
    total: nodes.length, reachedCount: Object.keys(reached).length
  };
}


/* ── filtering ────────────────────────────────────────────────────────── */

function matchesSearch(e) {
  var q = search.trim().toLowerCase();
  if (!q) return true;
  var hay = [e.title, e.hook, e.teaches, e.notes, e.id,
             e.out.join(" "), e["in"].join(" "),
             e.choices.map(function (c) { return c.label + " " + c.fx; }).join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}
function isVisible(e) {
  if (hidden.faction[e.faction] || hidden.type[e.type] || hidden.status[e.status]) return false;
  return matchesSearch(e);
}

/* ── DOM helpers ──────────────────────────────────────────────────────── */

function svgEl(tag, attrs, parent) {
  var el = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) { if (attrs[k] != null) el.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(el);
  return el;
}
function el(tag, props, kids) {
  var n = document.createElement(tag);
  props = props || {};
  for (var k in props) {
    var v = props[k];
    if (v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "on") { for (var ev in v) n.addEventListener(ev, v[ev]); }
    else if (k === "style") { for (var s in v) n.style[s] = v[s]; }
    else if (k in n && k !== "list") n[k] = v;
    else n.setAttribute(k, v);
  }
  (kids || []).forEach(function (c) {
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

var toastTimer = null;
function toast(msg, warn) {
  var old = $(".toast"); if (old) old.parentNode.removeChild(old);
  var t = el("div", { class: "toast" + (warn ? " warn" : ""), text: msg, role: "status" });
  $("#root").appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
}

/* ── canvas rendering ─────────────────────────────────────────────────── */

var geomUpdaters = [];
var textUpdaters = {};

function applyView() {
  world.setAttribute("transform", "translate(" + view.x + " " + view.y + ") scale(" + view.k + ")");
  $("#zoomval").textContent = Math.round(view.k * 100) + "%";
}

function edgePath(a, b) {
  var dx = b.x - a.x;
  return "M " + a.x + " " + a.y + " C " + (a.x + dx * 0.5) + " " + a.y + ", " +
         (b.x - dx * 0.5) + " " + b.y + ", " + b.x + " " + b.y;
}

function regionBox(type) {
  var members = allNodes().filter(function (e) { return e.type === type && isVisible(e); });
  if (!members.length) return null;
  var xs = members.map(function (m) { return m.x; }), ys = members.map(function (m) { return m.y; });
  var pad = 48;
  return {
    x: Math.min.apply(null, xs) - W / 2 - pad,
    y: Math.min.apply(null, ys) - H / 2 - pad - 14,
    w: (Math.max.apply(null, xs) - Math.min.apply(null, xs)) + W + pad * 2,
    h: (Math.max.apply(null, ys) - Math.min.apply(null, ys)) + H + pad * 2 + 14
  };
}

function renderCanvas() {
  syncIndex();
  derived = derive();
  reachCache = null;
  geomUpdaters = [];
  textUpdaters = {};
  clear(world);

  var gRegions = svgEl("g", null, world);
  var gLinks   = svgEl("g", null, world);
  var gFlags   = svgEl("g", null, world);
  var gDangle  = svgEl("g", null, world);
  var gNodes   = svgEl("g", null, world);

  // type regions — the quiet wash behind each cluster
  Object.keys(TYPES).filter(function (t) { return !TYPES[t].inQuest; }).concat(
    uniq(allNodes().map(function (e) { return e.type; })).filter(function (t) { return !TYPES[t]; })
  ).forEach(function (t) {
    var g = svgEl("g", null, gRegions);
    var rect = svgEl("rect", { rx: 18, "class": "region" }, g);
    var lbl = svgEl("text", { "class": "region-lbl" }, g);
    lbl.textContent = typeLabel(t).toUpperCase();
    geomUpdaters.push(function () {
      var b = regionBox(t);
      if (!b) { g.setAttribute("visibility", "hidden"); return; }
      g.removeAttribute("visibility");
      rect.setAttribute("x", b.x); rect.setAttribute("y", b.y);
      rect.setAttribute("width", b.w); rect.setAttribute("height", b.h);
      lbl.setAttribute("x", b.x + 16); lbl.setAttribute("y", b.y + 23);
    });
  });

  // quest containers — beats cluster by their quest, not by type
  (board.quests || []).forEach(function (q) {
    if (!q.beats || !q.beats.length) return;
    var g = svgEl("g", null, gRegions);
    var rect = svgEl("rect", { rx: 16, "class": "questregion" }, g);
    var lbl = svgEl("text", { "class": "questregion-lbl" }, g);
    lbl.textContent = q.title.toUpperCase();
    geomUpdaters.push(function () {
      var b = questBox(q);
      if (!b) { g.setAttribute("visibility", "hidden"); return; }
      g.removeAttribute("visibility");
      rect.setAttribute("x", b.x); rect.setAttribute("y", b.y);
      rect.setAttribute("width", b.w); rect.setAttribute("height", b.h);
      rect.setAttribute("stroke", factionColor(q.faction || "none"));
      lbl.setAttribute("x", b.x + 14); lbl.setAttribute("y", b.y + 21);
      lbl.setAttribute("fill", factionColor(q.faction || "none"));
    });
  });

  // prereq edges — sequence, drawn quiet so it never competes with the threads
  prereqEdges().forEach(function (e) {
    var g = svgEl("g", null, gLinks);
    var p = svgEl("path", { "class": "prereq", "marker-end": "url(#arrow-bone)" }, g);
    geomUpdaters.push(function () {
      var a = getNode(e.from), b = getNode(e.to);
      if (!a || !b) return;
      p.setAttribute("d", edgePath(a, b));
      var dim = !(isVisible(a) && isVisible(b));
      var hot = selectedId && (e.from === selectedId || e.to === selectedId);
      g.setAttribute("class", dim ? "dim" : "");
      p.setAttribute("class", "prereq" + (hot ? " hot" : ""));
    });
  });

  // manual links — dashed teal
  board.links.forEach(function (l) {
    var a = getNode(l.from), b = getNode(l.to);
    if (!a || !b) return;
    var g = svgEl("g", null, gLinks);
    var hit = svgEl("path", { "class": "link-hit" }, g);
    var p = svgEl("path", { "class": "link", "marker-end": "url(#arrow-teal)" }, g);
    var title = svgEl("title", null, g);
    title.textContent = "manual link · " + a.title + " → " + b.title + " (tap to remove)";
    var kill = function (ev) {
      ev.stopPropagation();
      if (window.confirm("Remove the manual link between “" + a.title + "” and “" + b.title + "”?")) delLink(l.from, l.to);
    };
    hit.addEventListener("click", kill);
    p.addEventListener("click", kill);
    geomUpdaters.push(function () {
      var na = getNode(l.from), nb = getNode(l.to);
      if (!na || !nb) return;
      var d = edgePath(na, nb);
      p.setAttribute("d", d); hit.setAttribute("d", d);
      var dim = !(isVisible(na) && isVisible(nb));
      var hot = selectedId && (l.from === selectedId || l.to === selectedId);
      g.setAttribute("class", dim ? "dim" : "");
      p.setAttribute("class", "link" + (hot ? " hot" : ""));
    });
  });

  // flag ties — solid gold, labelled at the midpoint
  derived.flagEdges.forEach(function (e) {
    var a = getNode(e.from), b = getNode(e.to);
    if (!a || !b) return;
    var g = svgEl("g", null, gFlags);
    var p = svgEl("path", { "class": "flagedge", "marker-end": "url(#arrow-gold)" }, g);
    var lbl = svgEl("text", { "class": "flagedge-lbl" }, g);
    lbl.textContent = e.flag;
    geomUpdaters.push(function () {
      var na = getNode(e.from), nb = getNode(e.to);
      if (!na || !nb) return;
      p.setAttribute("d", edgePath(na, nb));
      lbl.setAttribute("x", (na.x + nb.x) / 2);
      lbl.setAttribute("y", (na.y + nb.y) / 2 - 4);
      var dim = !(isVisible(na) && isVisible(nb));
      var hot = selectedId && (e.from === selectedId || e.to === selectedId);
      g.setAttribute("class", dim ? "dim" : "");
      p.setAttribute("class", "flagedge" + (hot ? " hot" : ""));
    });
  });

  // open threads — frayed gold stubs
  Object.keys(derived.dangling).forEach(function (id) {
    derived.dangling[id].forEach(function (f, j) {
      var g = svgEl("g", { "class": "dangle" }, gDangle);
      var line = svgEl("path", { "class": "dangle-line" }, g);
      var dot = svgEl("circle", { r: 3, "class": "dangle-dot" }, g);
      var lbl = svgEl("text", { "class": "dangle-lbl" }, g);
      lbl.textContent = f;
      geomUpdaters.push(function () {
        var nd = getNode(id);
        if (!nd || !isVisible(nd)) { g.setAttribute("visibility", "hidden"); return; }
        g.removeAttribute("visibility");
        var sx = nd.x + W / 2, sy = nd.y - 8 + j * 15, ex = sx + 70;
        line.setAttribute("d", "M " + sx + " " + sy + " L " + ex + " " + sy);
        dot.setAttribute("cx", ex); dot.setAttribute("cy", sy);
        lbl.setAttribute("x", ex + 6); lbl.setAttribute("y", sy + 3);
        var q = search.trim().toLowerCase();
        g.setAttribute("class", "dangle" + (q && f.toLowerCase().indexOf(q) !== -1 ? " match" : ""));
      });
    });
  });

  // nodes — opaque cards
  allNodes().forEach(function (e) {
    var g = svgEl("g", { "class": "node", tabindex: "0", role: "button" }, gNodes);
    var solid = svgEl("rect", { width: W, height: H, rx: 9, fill: "#211f1b" }, g);
    var tint = svgEl("rect", { width: W, height: H, rx: 9, "class": "node-bg" }, g);
    var spine = svgEl("rect", { width: 6, height: H, rx: 3 }, g);
    var dot = svgEl("circle", { cx: W - 14, cy: 14, r: 4.5, stroke: "#1b1a17", "stroke-width": 1 }, g);
    var title = svgEl("text", { x: 16, y: 24, "class": "node-title" }, g);
    var meta = svgEl("text", { x: 16, y: 41, "class": "node-meta" }, g);
    var flags = svgEl("text", { x: 16, y: 56, "class": "node-flags" }, g);
    var numText = svgEl("text", { x: W - 12, y: 57, "class": "node-num" }, g);
    var focus = svgEl("rect", { x: -3, y: -3, width: W + 6, height: H + 6, rx: 11, "class": "node-focus" }, g);
    var titleTip = svgEl("title", null, g);

    // Card text is refreshed on its own, so drawer edits don't rebuild the web.
    textUpdaters[e.id] = function () {
      var n = getNode(e.id) || e;
      var beat = n._kind === "beat";
      var q = beat ? getQuest(n._questId) : null;
      var label = beat ? (q ? q.title : "Quest") + " · beat " + ((n._ordinal || 0) + 1) : n.title;
      title.textContent = label.length > 21 ? label.slice(0, 20) + "…" : label;
      meta.textContent = beat
        ? "delivered " + (n.deliver || "auto") + (n.scope === "gated" ? " · gated" : "")
        : typeLabel(n.type) + " · " + (n.scope === "gated" ? "gated" : "universal");
      flags.textContent = (n.out.length ? "sets " + n.out.length : "") +
                          (n["in"].length ? (n.out.length ? "  " : "") + "needs " + n["in"].length : "") ||
                          "no flags";
      numText.textContent = beat ? String((n._ordinal || 0) + 1) : (n.n == null ? "" : String(n.n));
      titleTip.textContent = n.title + " — " + factionLabel(n.faction) + " · " + statusLabel(n.status);
      g.setAttribute("aria-label", n.title + ", " + (beat ? "quest beat" : typeLabel(n.type)) + ", " +
                     factionLabel(n.faction) + ", " + statusLabel(n.status));
    };
    textUpdaters[e.id]();

    g.addEventListener("pointerdown", function (ev) { onNodeDown(ev, e.id); });
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        if (mode === "connect") pickConnect(e.id); else select(e.id);
      }
    });

    geomUpdaters.push(function () {
      var n = getNode(e.id);
      if (!n) return;
      g.setAttribute("transform", "translate(" + (n.x - W / 2) + " " + (n.y - H / 2) + ")");
      var col = colorBy === "status" ? statusColor(n.status) : factionColor(n.faction);
      var other = colorBy === "status" ? factionColor(n.faction) : statusColor(n.status);
      var sel = n.id === selectedId;
      tint.setAttribute("fill", col + (sel ? "5e" : "40"));
      tint.setAttribute("stroke", col);

function renderGeometry() {
  for (var i = 0; i < geomUpdaters.length; i++) geomUpdaters[i]();
}

/* ── viewport maths ───────────────────────────────────────────────────── */

function viewportBox() {
  var rect = canvas.getBoundingClientRect();
  var pad = 16;
  var top = barH + pad, bottom = rect.height - pad, left = pad, right = rect.width - pad;
  if (!drawerEl.hidden) {
    if (window.innerWidth > 620) right -= Math.min(390, window.innerWidth * 0.92);
    else bottom -= rect.height * 0.74;
  }
  return { left: left, top: top, right: right, bottom: bottom,
           w: Math.max(80, right - left), h: Math.max(80, bottom - top) };
}

// minK: don't zoom out past this even if the board won't fit. Used for the
// opening view on a phone, where a true fit is too small to read.
function fit(minK) {
  if (!allNodes().length) return;
  var vb = viewportBox();
  var xs = allNodes().map(function (e) { return e.x; });
  var ys = allNodes().map(function (e) { return e.y; });
  var minX = Math.min.apply(null, xs) - W, minY = Math.min.apply(null, ys) - H;
  var maxY = Math.max.apply(null, ys) + H;
  // Open-thread stubs trail off the right edge of their card; frame them too.
  var maxX = Math.max.apply(null, allNodes().map(function (e) {
    return e.x + W + ((derived && derived.dangling[e.id]) ? 230 : 0);
  }));
  var k = clamp(Math.min(vb.w / (maxX - minX), vb.h / (maxY - minY)), K_MIN, 1.4);
  if (typeof minK === "number" && k < minK) k = minK;
  view = { k: k,
           x: (vb.left + vb.right) / 2 - ((minX + maxX) / 2) * k,
           y: (vb.top + vb.bottom) / 2 - ((minY + maxY) / 2) * k };
  applyView();
}

function zoomBy(f) {
  var vb = viewportBox();
  var cx = (vb.left + vb.right) / 2, cy = (vb.top + vb.bottom) / 2;
  zoomAt(cx, cy, f);
}
function zoomAt(cx, cy, f) {
  var nk = clamp(view.k * f, K_MIN, K_MAX);
  var wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view = { k: nk, x: cx - wx * nk, y: cy - wy * nk };
  applyView();
}
function centerWorld() {
  var vb = viewportBox();
  return { x: ((vb.left + vb.right) / 2 - view.x) / view.k, y: ((vb.top + vb.bottom) / 2 - view.y) / view.k };
}

/* ── pointer interaction ──────────────────────────────────────────────── */

var drag = { active: false };
var pointers = new Map();
var pinch = null;

function onBgDown(ev) {
  var isBg = ev.target === canvas || ev.target.getAttribute("data-bg") === "1";
  if (!isBg) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size >= 2) { drag.active = false; return; }
  closePanel();
  if (mode === "connect") { setConnectFrom(null); setMode(null); return; }
  drag = { active: true, kind: "bg", id: null, startX: ev.clientX, startY: ev.clientY,
           lastX: ev.clientX, lastY: ev.clientY, moved: false };
}

function onNodeDown(ev, id) {
  ev.stopPropagation();
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size >= 2) { drag.active = false; return; }
  closePanel();
  if (mode === "connect") { pickConnect(id); return; }
  select(id);
  drag = { active: true, kind: "node", id: id, startX: ev.clientX, startY: ev.clientY,
           lastX: ev.clientX, lastY: ev.clientY, moved: false };
}

function doPinch() {
  var vals = [];
  pointers.forEach(function (v) { vals.push(v); });
  if (vals.length < 2) return;
  var a = vals[0], b = vals[1];
  var dist = Math.hypot(a.x - b.x, a.y - b.y);
  var rect = canvas.getBoundingClientRect();
  var mx = (a.x + b.x) / 2 - rect.left, my = (a.y + b.y) / 2 - rect.top;
  if (!pinch) {
    pinch = { dist: dist, wx: (mx - view.x) / view.k, wy: (my - view.y) / view.k, k: view.k };
    drag.active = false;
    return;
  }
  var nk = clamp(pinch.k * (dist / pinch.dist), K_MIN, K_MAX);
  view = { k: nk, x: mx - pinch.wx * nk, y: my - pinch.wy * nk };
  applyView();
}

function onGlobalMove(ev) {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size >= 2) { doPinch(); return; }
  if (!drag.active) return;
  var dx = ev.clientX - drag.lastX, dy = ev.clientY - drag.lastY;
  drag.lastX = ev.clientX; drag.lastY = ev.clientY;
  if (Math.abs(ev.clientX - drag.startX) + Math.abs(ev.clientY - drag.startY) > 4) drag.moved = true;
  if (drag.kind === "bg") {
    view.x += dx; view.y += dy;
    applyView();
  } else if (drag.kind === "node") {
    var k = view.k;
    var moved = getNode(drag.id);
    if (moved) { moved.x += dx / k; moved.y += dy / k; }
    separateInPlace(drag.id);
    renderGeometry();
  }
}

function onGlobalUp(ev) {
  pointers["delete"](ev.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    if (drag.active && drag.kind === "node" && drag.moved) scheduleSave();
    if (drag.active && !drag.moved && drag.kind === "bg" && mode !== "connect") select(null);
    drag.active = false;
  }
}

function onWheel(ev) {
  ev.preventDefault();
  var rect = canvas.getBoundingClientRect();
  zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, ev.deltaY < 0 ? 1.12 : 0.89);
}

/* ── mutations ────────────────────────────────────────────────────────── */

var saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(commitSave, 220);
}
function commitSave() {
  if (!loaded) return;
  Store.save({ encounters: board.encounters, links: board.links,
               quests: (board.quests || []).map(exportQuest), engine: board.engine || null })
    .then(function (ok) {
      if (!ok && storageOK) {
        storageOK = false;
        toast("Couldn't autosave — export to a file to keep this board.", true);
      } else if (ok) storageOK = true;
    });
}

function select(id) {
  selectedId = id;
  renderDrawer();
  renderGeometry();
}

function setMode(m) {
  mode = m;
  $("#btn-connect").className = "btn" + (m === "connect" ? " on" : "");
  $("#btn-connect").textContent = m === "connect" ? "Linking…" : "Connect";
  renderHint();
  renderGeometry();
}
function setConnectFrom(id) { connectFrom = id; renderHint(); renderGeometry(); }

function renderHint() {
  if (mode !== "connect") { hintEl.hidden = true; return; }
  hintEl.hidden = false;
  hintEl.textContent = connectFrom
    ? "Tap a second encounter to tie them. Tap empty space to cancel."
    : "Tap an encounter to start a link.";
}

function pickConnect(id) {
  if (!connectFrom) { setConnectFrom(id); return; }
  if (connectFrom !== id) {
    var exists = board.links.some(function (l) {
      return (l.from === connectFrom && l.to === id) || (l.from === id && l.to === connectFrom);
    });
    if (!exists) board.links.push({ from: connectFrom, to: id });
  }
  connectFrom = null;
  setMode(null);
  renderCanvas();
  scheduleSave();
}

function delLink(from, to) {
  board.links = board.links.filter(function (l) { return !(l.from === from && l.to === to); });
  renderCanvas();
  scheduleSave();
}

function assign(id, props) {
  var n = getNode(id);
  if (!n) return;
  var wasId = n.id;
  Object.assign(n, props);
  if (n.id !== wasId) syncIndex();
}

// Graph-changing edits (id, out, in) — the whole web has to be redrawn.
function patch(id, props) {
  if (!getNode(id)) return;
  var nextId = props.id !== undefined ? str(props.id).trim() : null;
  assign(id, props);
  if (nextId && nextId !== id) {
    // Ids are the round-trip key; if the author renames one, carry the links with it.
    board.links = board.links.map(function (l) {
      return { from: l.from === id ? nextId : l.from, to: l.to === id ? nextId : l.to };
    });
    if (selectedId === id) selectedId = nextId;
    syncIndex();
  }
  renderCanvas();
  scheduleSave();
}

// Card-facing edits (title, n, type, faction, scope, status) — refresh one card
// and the geometry that follows from it (colors, type regions).
function patchField(id, props) {
  if (!getNode(id)) return;
  assign(id, props);
  if (textUpdaters[id]) textUpdaters[id]();
  renderGeometry();
  scheduleSave();
}

// Prose the card never shows. Only search results can depend on it.
function patchProse(id, props) {
  if (!getNode(id)) return;
  assign(id, props);
  if (search.trim()) setSearch(search);
  scheduleSave();
}

function addEncounter() {
  var c = centerWorld();
  var id = newId();
  board.encounters.push({
    id: id, n: null, title: "New encounter", type: "salvage", faction: "none",
    scope: "universal", status: "idea", hook: "", teaches: "",
    choices: [{ label: "", fx: "" }], out: [], "in": [], notes: "", x: c.x, y: c.y
  });
  syncIndex();
  separateInPlace(id);
  selectedId = id;
  renderCanvas();
  renderDrawer();
  scheduleSave();

  if (t) { t.focus(); t.select(); }
}

function delEncounter(id) {
  var n = getNode(id);
  if (!n) return;
  if (!window.confirm("Delete “" + n.title + "”? This can't be undone (export first if unsure).")) return;
  if (n._kind === "beat") {
    var q = getQuest(n._questId);
    if (q) q.beats = q.beats.filter(function (b) { return b.id !== id; });
    // A prereq pointing at a deleted beat would strand the ones after it.
    allNodes().forEach(function (o) {
      if (o.prereqs) o.prereqs = o.prereqs.filter(function (p) { return p !== id; });
    });
  } else {
    board.encounters = board.encounters.filter(function (e) { return e.id !== id; });
  }
  board.links = board.links.filter(function (l) { return l.from !== id && l.to !== id; });
  syncIndex();
  if (selectedId === id) selectedId = null;
  renderCanvas();
  renderDrawer();
  scheduleSave();
}

function tidy() {
  var order = Object.keys(TYPES).concat(
    uniq(board.encounters.map(function (e) { return e.type; })).filter(function (t) { return !TYPES[t]; })
  );
  var groups = {};
  board.encounters.forEach(function (e) { (groups[e.type] = groups[e.type] || []).push(e); });
  var colW = 540, rowH = 380, perRow = 3, ti = 0, bottom = 240;
  order.forEach(function (t) {
    var members = groups[t];
    if (!members || !members.length) return;
    var cx = (ti % perRow) * colW + 320, cy = Math.floor(ti / perRow) * rowH + 240;
    ti++;
    members.forEach(function (m, i) {
      m.x = cx + (i % 2) * (W + 44);
      m.y = cy + Math.floor(i / 2) * (H + 36);
      bottom = Math.max(bottom, m.y);
    });
  });

  // Quests below the encounter clusters: each a two-column block of its beats
  // in prereq order, so a chain reads down the block.
  var quests = (board.quests || []).filter(function (q) { return q.beats && q.beats.length; });
  var cellW = 2 * (W + 44) + 140;
  var perQuestRow = Math.max(4, Math.ceil(Math.sqrt(quests.length)));
  var y = bottom + rowH;
  for (var i = 0; i < quests.length; i += perQuestRow) {
    var band = quests.slice(i, i + perQuestRow), tallest = 0;
    band.forEach(function (q, qi) {
      var beats = questBeatsInOrder(q);
      var qx = qi * cellW + 320;
      beats.forEach(function (b, bi) {
        b.x = qx + (bi % 2) * (W + 44);
        b.y = y + Math.floor(bi / 2) * (H + 36);
      });
      tallest = Math.max(tallest, Math.ceil(beats.length / 2) * (H + 36));
    });
    y += tallest + 190;
  }

  syncIndex();
  separateInPlace(null);
  renderCanvas();
  scheduleSave();
  setTimeout(fit, 60);
}

/* ── placement for imported nodes without coordinates ─────────────────── */

function placeMissingInPlace() {
  var c = centerWorld();
  var placed = 0;
  allNodes().forEach(function (e) {
    if (e.x != null && e.y != null) return;
    var ring = Math.floor(placed / 8) + 1, a = (placed % 8) * (Math.PI / 4);
    placed++;
    e.x = c.x + Math.cos(a) * ring * (W + PADX + 40);
    e.y = c.y + Math.sin(a) * ring * (H + PADY + 60);
  });
}

    drawerEl.appendChild(el("label", { class: "dr-field" }, [
      "Prereq beats ", el("span", { class: "dr-hintlbl", text: "comma-sep beat ids" }),
      el("input", { class: "mono", value: (e.prereqs || []).join(", "),
        on: { change: function (ev) {
          patch(id, { prereqs: parseFlags(ev.target.value) });
        } } })
    ]));
  }

  drawerEl.appendChild(el("label", { class: "dr-field" }, [
    "Notes for Claude ", el("span", { class: "dr-hintlbl", text: "engine caveats, variants" }),
    el("textarea", { rows: 3, value: e.notes,
      on: { input: function (ev) { patchProse(id, { notes: ev.target.value }); } } })
  ]));

  // Engine rows are shown, never silently edited here: the tool has no business
  // rewriting an effect it doesn't own.
  var eng = e.engine;
  var mech = (e.choices || []).filter(function (c) { return c.engine; });
  if (eng || mech.length) {
    var box = el("div", { class: "dr-engine" });
    box.appendChild(el("div", { class: "dr-engine-h", text: "From the encounter builder" }));
    if (eng && eng.kind) box.appendChild(engLine("row", eng.kind));
    if (eng && eng.mode) box.appendChild(engLine("mode", eng.mode));
    if (eng && eng.copies !== undefined) box.appendChild(engLine("copies", String(eng.copies)));
    if (eng && eng.recipient) box.appendChild(engLine("recipient", eng.recipient));
    if (eng && eng.triggerCondition) box.appendChild(engLine("trigger", conditionPhrase(eng.triggerCondition)));
    if (eng && eng.triggerStrength !== undefined) {
      box.appendChild(engLine("weight", typeof eng.triggerStrength === "object"
        ? "conditional" : String(eng.triggerStrength)));
    }
    if (eng && eng.deliverCondition) box.appendChild(engLine("delivers when", conditionPhrase(eng.deliverCondition)));
    if (eng && eng.placementFilter) box.appendChild(engLine("placement", JSON.stringify(eng.placementFilter)));
    if (eng && eng.art) box.appendChild(engLine("art", eng.art));
    mech.forEach(function (c) {
      var types = [];
      walkEffects(c.engine.effects, function (x) { types.push(x.type); });
      box.appendChild(engLine(c.engine.id, uniq(types).join(", ") || "no effects"));
    });
    box.appendChild(el("div", { class: "dr-warn",
      text: "Effects and conditions are carried through export unchanged. Editing a title, body or "
          + "choice label here writes back; nothing else does." }));
    drawerEl.appendChild(box);
  }

  drawerEl.appendChild(el("div", { class: "dr-foot" }, [
    el("button", { class: "btn ghost", text: "Link from here", on: { click: function () {
      setMode("connect"); setConnectFrom(id);
    } } }),
    el("button", { class: "btn danger", text: "Delete", on: { click: function () { delEncounter(id); } } })
  ]));

  if (wasHidden) setTimeout(renderGeometry, 0);
}

function engLine(k, v) {
  return el("div", { class: "eng-line" }, [
    el("span", { class: "eng-k", text: k }),
    el("span", { class: "eng-v", text: String(v) })
  ]);
}

function patchChoice(id, i, props) {
  var n = getNode(id);
  if (!n || !n.choices[i]) return;
  Object.assign(n.choices[i], props);
  scheduleSave();
}

// Writing the tokenized list back into the field is the feedback: typing
// "a OR b" visibly becomes "a, b" on blur, so a fork can't hide as one flag.
function commitFlagField(input, id, key) {
  var flags = parseFlags(input.value);
  var props = {};
  props[key] = flags;
  patch(id, props);
  input.value = flags.join(", ");
}

// Flags re-render the whole web, which would steal focus mid-typing; update the
// data on every keystroke but only redraw once the field settles.
var flagTimer = null;
function patchFlagsLive(id, key, value) {
  var p = {};
  p[key] = parseFlags(value);
  assign(id, p);
  if (textUpdaters[id]) textUpdaters[id]();
  clearTimeout(flagTimer);
  flagTimer = setTimeout(function () { renderCanvas(); }, 420);
  scheduleSave();
}

/* ── systems: what the content asks the engine for ────────────────────── */

// Every effect type and condition operator the board uses, whether the run can
// carry it out, and the authors' own notes about what is still missing. This is
// the reconciliation surface: nothing here is a change to the content, only a
// reading of it.
function systemsReport() {
  var effTypes = {}, condOps = {}, notes = [], engineChoices = 0;
  // Operators that appear only in triggerStrength. The walk never evaluates
  // those -- a draw weight is the engine's business -- so counting them beside
  // the conditions it does evaluate overstated what runs.
  var strengthOps = {};
  // Board data the walk reads, stores and shows in the drawer, but cannot act
  // on, because it describes a map and a deck this tool does not simulate.
  var placement = { copies: 0, weight: 0, filter: 0, discovered: 0, recipient: 0 };
  allNodes().forEach(function (n) {
    (n.choices || []).forEach(function (c) {
      if (!c.engine) return;
      engineChoices++;
      walkEffects(c.engine.effects, function (e) {
        var row = effTypes[e.type] = effTypes[e.type] || { count: 0, notes: [], where: [] };
        row.count++;
        if (row.where.length < 4 && row.where.indexOf(n.title) === -1) row.where.push(n.title);
        if (e._note) {
          row.notes.push(e._note);
          notes.push({ id: e.id || "", type: e.type, note: e._note, where: n.title });
        }
      });
      conditionOps(c.engine.condition).forEach(function (op) {
        condOps[op] = (condOps[op] || 0) + 1;
      });
    });
    var eng = n.engine || {};
    [eng.triggerCondition, eng.deliverCondition].forEach(function (c) {
      conditionOps(c).forEach(function (op) { condOps[op] = (condOps[op] || 0) + 1; });
    });
    conditionOps(eng.triggerStrength).forEach(function (op) {
      strengthOps[op] = (strengthOps[op] || 0) + 1;
    });
    if (eng.copies !== undefined && Number(eng.copies) > 1) placement.copies++;
    if (eng.triggerStrength !== undefined) placement.weight++;
    if (eng.placementFilter) placement.filter++;
    if (eng.recipient) placement.recipient++;
    if (n._kind === "beat" && n.deliver === "discovered") placement.discovered++;
  });

  var readme = (board.engine && board.engine.source && board.engine.source._readme) || null;

  // Flag-level validation across every node, beats included.
  var d = derived || derive();
  var seeds = {};
  if (readme && readme.deliberate_seeds) {
    String(readme.deliberate_seeds).split(/[,\s]+/).forEach(function (w) {
      if (/^[a-z0-9_]{4,}$/.test(w)) seeds[w] = 1;
    });
  }

  return {
    effTypes: effTypes, condOps: condOps, strengthOps: strengthOps,
    placement: placement, notes: notes, readme: readme,
    engineChoices: engineChoices,
    unmet: d.unmet, open: d.openFlags, seeds: seeds
  };
}

function renderSystems() {
  clear(systemsEl);
  var r = systemsReport();

  var effKeys = Object.keys(r.effTypes).sort(function (a, b) {
    return r.effTypes[b].count - r.effTypes[a].count;
  });

  if (!effKeys.length) {
    systemsEl.appendChild(el("div", { class: "cov-lead",
      text: "No engine-format content on this board yet." }));
    systemsEl.appendChild(el("div", { class: "leg-note",
      text: "Import an encounter-builder JSON (world_encounters / quests / choices / effects) " +
            "and this panel reports every effect type and condition it uses, which of them the " +
            "run can carry out, and the notes its authors left about what the engine still owes." }));
    return;
  }

  systemsEl.appendChild(el("div", { class: "cov-lead",
    text: r.engineChoices + " mechanized choices across " + effKeys.length + " effect types." }));

  var missing = effKeys.filter(function (t) {
    return !SIMULATED_EFFECTS[t] && !NAMED_ONLY_EFFECTS[t];
  });
  systemsEl.appendChild(el("div", { class: "cov-h", text: "Effects the walk cannot carry out (" + missing.length + ")" }));
  if (missing.length) {
    systemsEl.appendChild(el("div", { class: "leg-note",
      text: "Preserved exactly as authored and exported unchanged. A walk records each one as " +
            "“the engine would…” rather than pretending it happened." }));
    missing.forEach(function (t) {
      var row = r.effTypes[t];
      systemsEl.appendChild(el("div", { class: "sys-row" }, [
        el("div", { class: "sys-head" }, [
          el("span", { class: "sys-type", text: t }),
          el("span", { class: "sys-count", text: String(row.count) })
        ]),
        el("div", { class: "sys-where", text: row.where.join(" · ") }),
        row.notes.length ? el("div", { class: "sys-note", text: row.notes[0] }) : null
      ]));
    });
  } else {
    systemsEl.appendChild(el("div", { class: "cov-empty",
      text: "none beyond the named-only effects below" }));
  }

  var named = effKeys.filter(function (t) { return NAMED_ONLY_EFFECTS[t]; });
  if (named.length) {
    systemsEl.appendChild(el("div", { class: "cov-h",
      text: "Named, but nothing behind them (" + named.length + ")" }));
    systemsEl.appendChild(el("div", { class: "leg-note",
      text: "These read and phrase correctly, so content using them looks handled — but the walk " +
            "has no deck and no map to act on. Where a prereq chain says the same thing as an " +
            "ADVANCE_QUEST, order still holds; where it does not, the sequence exists only in the " +
            "engine's head. Coverage names any quest in that position." }));
    named.forEach(function (t) {
      var row = r.effTypes[t];
      systemsEl.appendChild(el("div", { class: "sys-row" }, [
        el("div", { class: "sys-head" }, [
          el("span", { class: "sys-type warn", text: t }),
          el("span", { class: "sys-count", text: String(row.count) })
        ]),
        el("div", { class: "sys-where", text: row.where.join(" · ") }),
        row.notes.length ? el("div", { class: "sys-note", text: row.notes[0] }) : null
      ]));
    });
  }

  var pl = r.placement;
  var plRows = [
    ["copies", pl.copies, "field encounters with more than one copy in the deck"],
    ["draw weight", pl.weight, "cards whose triggerStrength decides how often they come up"],
    ["placement filter", pl.filter, "beats that can only land on certain ground"],
    ["deliver: discovered", pl.discovered, "beats found by exploring, offered here as though automatic"],
    ["recipient", pl.recipient, "encounters aimed at a particular player"]
  ].filter(function (x) { return x[1]; });
  if (plRows.length) {
    systemsEl.appendChild(el("div", { class: "cov-h", text: "Board data the walk ignores" }));
    systemsEl.appendChild(el("div", { class: "leg-note",
      text: "The engine deals a different board every session; this tool walks one fixed graph. " +
            "All of it is kept whole and exported unchanged — it just has no bearing on what a " +
            "walk offers you." }));
    plRows.forEach(function (x) {
      systemsEl.appendChild(el("div", { class: "cov-row" }, [
        el("span", { class: "k", text: x[0] }),
        el("span", { class: "v", text: String(x[1]) })
      ]));
      systemsEl.appendChild(el("div", { class: "sys-where", text: x[2] }));
    });
  }

  systemsEl.appendChild(el("div", { class: "cov-h", text: "Effects the walk applies" }));
  var applied = effKeys.filter(function (t) { return SIMULATED_EFFECTS[t]; });
  systemsEl.appendChild(el("div", { class: "cov-flags" }, applied.map(function (t) {
    return el("span", { class: "cov-flag", text: t + " " + r.effTypes[t].count });
  })));

  var ops = Object.keys(r.condOps).sort();
  if (ops.length) {
    systemsEl.appendChild(el("div", { class: "cov-h", text: "Condition operators" }));
    systemsEl.appendChild(el("div", { class: "cov-flags" }, ops.map(function (o) {
      return el("span", { class: "cov-flag" + (SIMULATED_CONDITIONS[o] ? "" : " unmet"),
                          text: o + " " + r.condOps[o] });
    })));
  }

  var sOps = Object.keys(r.strengthOps).sort();
  if (sOps.length) {
    systemsEl.appendChild(el("div", { class: "cov-h", text: "Operators used only for draw weight" }));
    systemsEl.appendChild(el("div", { class: "leg-note",
      text: "These sit in triggerStrength, which decides how likely a card is to come up. " +
            "The walk never evaluates them." }));
    systemsEl.appendChild(el("div", { class: "cov-flags" }, sOps.map(function (o) {
      return el("span", { class: "cov-flag unmet", text: o + " " + r.strengthOps[o] });
    })));
  }

  if (r.notes.length) {
    systemsEl.appendChild(el("div", { class: "cov-h", text: "Authors' notes on the content (" + r.notes.length + ")" }));
    r.notes.forEach(function (n) {
      systemsEl.appendChild(el("div", { class: "sys-row" }, [
        el("div", { class: "sys-head" }, [
          el("span", { class: "sys-type", text: n.type }),
          el("span", { class: "sys-count", text: n.id })
        ]),
        el("div", { class: "sys-where", text: n.where }),
        el("div", { class: "sys-note", text: n.note })
      ]));
    });
  }

  // The file's own readme, rendered rather than buried in the JSON.
  var rd = r.readme;
  if (rd) {
    if (rd.required_systems) {
      systemsEl.appendChild(el("div", { class: "cov-h", text: "Required systems (from the file)" }));
      Object.keys(rd.required_systems).forEach(function (k) {
        systemsEl.appendChild(el("div", { class: "sys-row" }, [
          el("div", { class: "sys-head" }, [el("span", { class: "sys-type", text: k })]),

// navigator.clipboard is unavailable on file:// and older mobile browsers, so
// keep the textarea fallback.
function copyText(text, btn) {
  var done = function (ok) {
    if (btn) {
      var label = btn.textContent;
      btn.textContent = ok ? "Copied" : "Press ⌘/Ctrl+C";
      setTimeout(function () { btn.textContent = label; }, 1800);
    }
    if (!ok) toast("Couldn't reach the clipboard.", true);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
  } else fallback();

  function fallback() {
    var ta = el("textarea", { value: text, style: { position: "fixed", opacity: "0", top: "0", left: "0" } });
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }
}

function stamp() {
  var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         "-" + p(d.getHours()) + p(d.getMinutes());
}

function downloadBoard() {

function downloadJSON(data, name) {
  var text = JSON.stringify(data, null, 2);
  try {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.parentNode.removeChild(a); }, 500);
    toast("Saved " + name);
    return true;
  } catch (err) {
    toast("Download blocked by the browser.", true);
    return false;
  }
}

function summarizeMerge(incoming) {
  var byId = {};
  allNodes().forEach(function (e) { byId[e.id] = e; });
  var added = 0, changed = 0, same = 0;
  var all = incoming.encounters.concat(
    (incoming.quests || []).reduce(function (acc, q) { return acc.concat(q.beats || []); }, [])
  );
  all.forEach(function (inc) {
    var cur = byId[inc.id];
    if (!cur) { added++; return; }
    var a = JSON.stringify(exportEncounter(Object.assign({}, cur, incomingPatch(inc))));
    var b = JSON.stringify(exportEncounter(cur));
    if (a === b) same++; else changed++;
  });
  var existingLinks = {};
  board.links.forEach(function (l) { existingLinks[l.from + "→" + l.to] = 1; existingLinks[l.to + "→" + l.from] = 1; });
  var newLinks = incoming.links.filter(function (l) { return !existingLinks[l.from + "→" + l.to]; }).length;
  var questIds = {};
  board.quests.forEach(function (q) { if (q && q.id) questIds[q.id] = 1; });
  var newQuests = incoming.quests.filter(function (q) { return !(q && q.id && questIds[q.id]); }).length;
  return { added: added, changed: changed, same: same, newLinks: newLinks,
           quests: incoming.quests.length, newQuests: newQuests };
}

// An import that omits a field must not blank what's on the board: only the
// keys the file actually carried are applied over the existing encounter.
function incomingPatch(inc) {
  var present = inc._present;
  var o = {};
  Object.keys(inc).forEach(function (k) {
    if (present && !present[k]) return;
    o[k] = inc[k];
  });
  if (o.x == null) delete o.x;
  if (o.y == null) delete o.y;
  return o;
}

function applyMerge(incoming) {
  var byId = {};
  board.encounters.forEach(function (e, i) { byId[e.id] = i; });
  incoming.encounters.forEach(function (inc) {
    var i = byId[inc.id];
    if (i === undefined) board.encounters.push(inc);
    else Object.assign(board.encounters[i], incomingPatch(inc));
  });

  var seen = {};
  board.links.forEach(function (l) { seen[l.from + "→" + l.to] = 1; seen[l.to + "→" + l.from] = 1; });
  incoming.links.forEach(function (l) {
    var k = l.from + "→" + l.to;
    if (seen[k]) return;
    seen[k] = 1; seen[l.to + "→" + l.from] = 1;
    board.links.push(l);
  });

  // Quests merge by id, and so do their beats — a chat handing back one revised
  // beat must not drop the rest of the chain.
  var qIdx = {};
  board.quests.forEach(function (q, i) { if (q && q.id) qIdx[q.id] = i; });
  incoming.quests.forEach(function (q) {
    if (!q || !q.id) return;
    if (qIdx[q.id] === undefined) { board.quests.push(q); return; }
    var cur = board.quests[qIdx[q.id]];
    Object.keys(q).forEach(function (k) { if (k !== "beats") cur[k] = q[k]; });
    var bIdx = {};
    cur.beats.forEach(function (b, i) { bIdx[b.id] = i; });
    (q.beats || []).forEach(function (b) {
      if (bIdx[b.id] === undefined) cur.beats.push(b);
      else Object.assign(cur.beats[bIdx[b.id]], incomingPatch(b));
    });
  });

  var fromEngine = !!incoming.engine;
  if (fromEngine) board.engine = incoming.engine;

  syncIndex();
  board.links = board.links.filter(function (l) { return getNode(l.from) && getNode(l.to); });
  placeMissingInPlace();
  separateInPlace(null);

  // The builder's format carries no coordinates, so a spiral of 160 cards would
  // be the first thing seen. Lay it out properly instead.
  if (fromEngine) { tidy(); return; }

  renderCanvas();
  renderDrawer();
  commitSave();
}

// Hand the builder its own file back. Every row is the row that came in; only
// the prose fields the tool can edit are written through, and the count of
// those is reported so nothing changes silently. Effects and conditions are
// never touched.
function engineExport() {
  if (!board.engine || !board.engine.source) return null;
  var src = JSON.parse(JSON.stringify(board.engine.source));
  var touched = { titles: 0, texts: 0, labels: 0 };

  function writeNode(row, textKey) {
    var n = getNode(row.id);
    if (!n) return;
    if (row.title !== undefined && n.title !== row.title && n._kind !== "beat") {
      row.title = n.title; touched.titles++;
    }
    if (n.hook !== row[textKey]) { row[textKey] = n.hook; touched.texts++; }
  }
  (src.world_encounters || []).forEach(function (r) { writeNode(r, "text"); });
  (src.field_encounters || []).forEach(function (r) { writeNode(r, "text"); });
  (src.quest_beats || []).forEach(function (r) { writeNode(r, "text"); });
  (src.quests || []).forEach(function (q) {
    var quest = getQuest(q.id);
    if (quest && quest.title !== q.title) { q.title = quest.title; touched.titles++; }
  });

  var labelById = {};
  allNodes().forEach(function (n) {
    (n.choices || []).forEach(function (c) {
      if (c.engine && c.engine.id) labelById[c.engine.id] = c;
    });
  });
  (src.choices || []).forEach(function (row) {
    var c = labelById[row.id];
    if (!c) return;
    if (c.label !== row.label) { row.label = c.label; touched.labels++; }
    if (c.engine.outcomeText !== row.outcomeText && c.engine.outcomeText !== undefined) {
      row.outcomeText = c.engine.outcomeText; touched.texts++;
    }
  });

  return { data: src, touched: touched };
}

    var stats = el("div", { class: "modal-stats" });
    [[s.added, "new encounter" + (s.added === 1 ? "" : "s") + " added"],
     [s.changed, "existing encounter" + (s.changed === 1 ? "" : "s") + " updated in place"],
     [s.same, "unchanged"],
     [s.newLinks, "new manual link" + (s.newLinks === 1 ? "" : "s")],

      applyMerge(incoming);
