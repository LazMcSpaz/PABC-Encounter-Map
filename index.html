<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Thread Web — a pannable canvas for authoring Remnant Continent encounter content.">
<title>Thread Web — Remnant Continent encounter canvas</title>
<style>
:root{
  --bg:#1b1a17; --bg2:#211f1b; --panel:#26241f; --panel2:#2f2c25;
  --bone:#e9e3d5; --muted:#9a9484; --faint:#6a655a; --line:#39352d;
  --gold:#d4b26a; --teal:#4a9d9d; --rust:#d98a76; --sage:#7a9b6e;
  --barH:60px;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* author display rules must not defeat it */
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--bone); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.root{position:relative;width:100%;height:100%;min-height:100%}

/* ── focus ───────────────────────────────────────────────────────────── */
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.node:focus-visible .node-focus{opacity:1}

/* ── toolbar ─────────────────────────────────────────────────────────── */
.bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:.9rem;
  padding:.55rem .8rem calc(.55rem + env(safe-area-inset-top,0px));
  padding-left:calc(.8rem + env(safe-area-inset-left,0px));
  padding-right:calc(.8rem + env(safe-area-inset-right,0px));
  background:linear-gradient(#1b1a17f5,#1b1a17e6);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand-serif{font-family:var(--serif);font-size:1.15rem;font-weight:600}
.brand-sub{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:.35rem}
.btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--bone);
  font-family:var(--mono);font-size:.72rem;line-height:1;
  padding:.5rem .7rem;border-radius:5px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
  min-height:32px;white-space:nowrap;
}
.btn:hover{background:#38342c}
.btn.primary{background:rgba(212,178,106,.16);border-color:rgba(212,178,106,.5);color:var(--gold)}
.btn.ghost{background:transparent;padding:.5rem .55rem}
.btn.on{background:rgba(74,157,157,.18);border-color:var(--teal);color:#8fd4d4}
.btn.danger{background:rgba(192,90,68,.14);border-color:rgba(192,90,68,.5);color:var(--rust)}
.btn[disabled]{opacity:.45;cursor:default}
.sep{width:1px;height:20px;background:var(--line);margin:0 .15rem}
.zoom{font-family:var(--mono);font-size:.68rem;color:var(--muted);min-width:40px;text-align:center}
.search{
  background:var(--bg2);border:1px solid var(--line);color:var(--bone);
  font-family:var(--mono);font-size:.72rem;padding:.45rem .6rem;border-radius:5px;width:118px;min-height:32px;
}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--gold)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg .seglbl{font-family:var(--mono);font-size:.6rem;color:var(--faint);padding:.5rem .4rem .5rem .55rem;align-self:center;letter-spacing:.08em;text-transform:uppercase}
.segbtn{
  background:transparent;border:none;border-left:1px solid var(--line);color:var(--muted);
  font-family:var(--mono);font-size:.68rem;padding:.5rem .55rem;cursor:pointer;min-height:32px;
}
.segbtn.on{background:rgba(212,178,106,.14);color:var(--gold)}
.chipbtn{display:flex;align-items:center;gap:.35rem}
.chipbtn .chip-open{color:var(--gold)}
.chipbtn .chip-warn{color:var(--rust)}
.chipbtn .chip-ok{color:var(--sage)}

/* ── floating panels ─────────────────────────────────────────────────── */
.hint{
  position:absolute;left:50%;transform:translateX(-50%);z-index:22;top:calc(var(--barH) + 8px);
  background:rgba(74,157,157,.16);border:1px solid var(--teal);color:#8fd4d4;
  font-family:var(--mono);font-size:.72rem;padding:.35rem .8rem;border-radius:20px;
  max-width:calc(100% - 2rem);text-align:center;
}
.panel{
  position:absolute;z-index:22;top:calc(var(--barH) + 8px);
  background:rgba(30,28,24,.97);border:1px solid var(--line);border-radius:10px;
  padding:.8rem .95rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  max-height:min(62vh,520px);overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.45);
  -webkit-overflow-scrolling:touch;
}
.panel.legend{left:.8rem;max-width:min(360px,calc(100% - 1.6rem))}
.panel.coverage{left:.8rem;width:min(340px,calc(100% - 1.6rem))}
.panel.menu{right:.8rem;width:min(260px,calc(100% - 1.6rem));padding:.45rem}
.leg-cols{display:flex;gap:1.3rem;flex-wrap:wrap}
.leg-group{display:flex;flex-direction:column;gap:.1rem}
.leg-h{font-family:var(--mono);font-size:.57rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.leg-item{
  display:flex;align-items:center;gap:.42rem;background:none;border:none;color:var(--bone);
  font-size:.76rem;cursor:pointer;padding:.22rem .1rem;text-align:left;transition:opacity .12s;font-family:var(--sans);
}
.leg-item.off{opacity:.32;text-decoration:line-through}
.leg-count{color:var(--faint);font-family:var(--mono);font-size:.62rem;margin-left:auto;padding-left:.5rem}
.leg-dot{width:10px;height:10px;border-radius:50%;flex:none}
.leg-sq{width:10px;height:10px;border-radius:2px;border:1px dashed var(--faint);flex:none}
.leg-note{font-family:var(--mono);font-size:.6rem;color:var(--faint);margin-top:.55rem;line-height:1.5}
.leg-edgekey{
  font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:.55rem;padding-top:.5rem;
  border-top:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:.15rem;
}
.k-gold,.k-teal,.k-fray{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:3px}
.k-gold{border-color:var(--gold)}
.k-teal{border-color:var(--teal);border-top-style:dashed}
.k-fray{border-color:var(--gold);border-top-style:dotted;opacity:.6}

.cov-h{font-family:var(--mono);font-size:.57rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:.7rem 0 .3rem}
.cov-h:first-child{margin-top:0}
.cov-lead{font-family:var(--serif);font-size:.94rem;line-height:1.45;color:var(--bone)}
.cov-row{display:flex;align-items:baseline;gap:.5rem;font-size:.76rem;padding:.14rem 0}
.cov-row .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cov-row .v{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.cov-row.zero .k{color:var(--rust)}
.cov-row.zero .v{color:var(--rust)}
.cov-flags{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.cov-flag{
  font-family:var(--mono);font-size:.64rem;padding:.16rem .38rem;border-radius:4px;cursor:pointer;
  background:rgba(212,178,106,.1);border:1px solid rgba(212,178,106,.32);color:var(--gold);
}
.cov-flag.unmet{background:rgba(217,138,118,.1);border-color:rgba(217,138,118,.35);color:var(--rust)}
.cov-empty{font-family:var(--mono);font-size:.66rem;color:var(--faint)}
.cov-reach{
  display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  border-left:2px solid var(--rust);padding:.22rem .5rem;margin:.18rem 0;font:inherit;color:inherit;
}
.cov-reach:hover{background:rgba(217,138,118,.07)}
.cov-reach .k{display:block;font-size:.78rem;color:var(--bone)}
.cov-reach .reach-why{display:block;font-family:var(--mono);font-size:.62rem;color:var(--rust);margin-top:.1rem}
.cov-reach.prereq{border-left-color:var(--gold)}
.cov-reach.prereq .reach-why{color:var(--gold)}
.cov-reach.cycle{border-left-color:var(--rust)}
.sys-row{border-top:1px solid rgba(57,53,45,.7);padding:.45rem 0}
.sys-head{display:flex;align-items:baseline;gap:.5rem}
.sys-type{font-family:var(--mono);font-size:.7rem;color:var(--gold)}
.sys-type.warn{color:var(--rust)}
.sys-count{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-left:auto}
.sys-where{font-size:.72rem;color:var(--muted);margin-top:.12rem}
.sys-note{font-size:.74rem;color:var(--bone);opacity:.8;line-height:1.5;margin-top:.2rem}
.menu-item{
  display:block;width:100%;text-align:left;background:none;border:none;color:var(--bone);
  font-family:var(--mono);font-size:.72rem;padding:.55rem .6rem;border-radius:5px;cursor:pointer;
}
.menu-item:hover{background:var(--panel2)}
.menu-item.danger{color:var(--rust)}
.menu-sep{height:1px;background:var(--line);margin:.3rem .2rem}
.menu-note{font-family:var(--mono);font-size:.6rem;color:var(--faint);padding:.35rem .6rem;line-height:1.5}

/* ── canvas ──────────────────────────────────────────────────────────── */
.canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.region{fill:rgba(255,255,255,.02);stroke:var(--line);stroke-width:1;stroke-dasharray:6 7;pointer-events:none}
.questregion{fill:rgba(255,255,255,.028);stroke-width:1;stroke-opacity:.4;stroke-dasharray:3 5;pointer-events:none}
.questregion-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;opacity:.75;pointer-events:none}
.prereq{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.45;pointer-events:none}
.prereq.hot{opacity:.95;stroke-width:2}
.region-lbl{font-family:var(--mono);font-size:13px;letter-spacing:.18em;fill:var(--faint);pointer-events:none}
.node{transition:opacity .15s;cursor:grab}
.node.dim{opacity:.16}
.node.connecting{cursor:crosshair}
.node-bg{transition:stroke .12s,fill .12s}
.node.cf .node-bg{stroke:#8fd4d4 !important;stroke-width:2.5}
.node-focus{fill:none;stroke:var(--bone);stroke-width:2;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.node-title{font-family:var(--serif);font-size:14.5px;font-weight:600;fill:#f4efe3;pointer-events:none}
.node-meta{font-family:var(--sans);font-size:10px;fill:#cdc6b5;pointer-events:none}
.node-flags{font-family:var(--mono);font-size:9px;fill:var(--gold);opacity:.9;pointer-events:none}
.node-num{font-family:var(--mono);font-size:9px;fill:var(--faint);text-anchor:end;pointer-events:none}
.flagedge{fill:none;stroke:var(--gold);stroke-width:1.4;opacity:.62;pointer-events:none}
.flagedge.hot{opacity:1;stroke-width:2.4}
.flagedge-lbl{font-family:var(--mono);font-size:10px;fill:var(--gold);opacity:.85;text-anchor:middle;pointer-events:none}
.link{fill:none;stroke:var(--teal);stroke-width:1.4;stroke-dasharray:5 4;opacity:.7;cursor:pointer}
.link:hover,.link.hot{opacity:1;stroke-width:2.2}
.link-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.dim{opacity:.12 !important}
.dangle-line{stroke:var(--gold);stroke-width:1;stroke-dasharray:2 3;opacity:.5}
.dangle-dot{fill:var(--gold);opacity:.6}
.dangle-lbl{font-family:var(--mono);font-size:9px;fill:var(--gold);opacity:.6;font-style:italic;pointer-events:none}
.dangle.match .dangle-line,.dangle.match .dangle-dot,.dangle.match .dangle-lbl{opacity:1;stroke-width:1.6}

/* ── drawer ──────────────────────────────────────────────────────────── */
.drawer{
  position:absolute;top:var(--barH);right:0;bottom:0;width:min(390px,92vw);z-index:18;
  background:var(--bg2);border-left:1px solid var(--line);
  padding:1rem 1.05rem calc(2rem + env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:-14px 0 34px rgba(0,0,0,.4);
}
.dr-head{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.8rem}
.dr-title{
  flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--bone);
  font-family:var(--serif);font-size:1.25rem;font-weight:600;padding:.2rem 0;min-width:0;
}
.dr-title:focus{outline:none;border-bottom-color:var(--gold)}
.dr-x{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:.25rem .3rem;line-height:1}
.dr-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.6rem}
.dr-row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.6rem}
.drawer label{
  display:flex;flex-direction:column;gap:.22rem;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.drawer select,.drawer input,.drawer textarea{
  background:var(--bg);border:1px solid var(--line);color:var(--bone);border-radius:4px;
  padding:.42rem .45rem;font-family:var(--sans);font-size:.85rem;text-transform:none;letter-spacing:normal;width:100%;
}
.drawer textarea{resize:vertical;line-height:1.5}
.drawer select:focus,.drawer input:focus,.drawer textarea:focus{outline:none;border-color:var(--gold)}
.mono{font-family:var(--mono) !important;font-size:.74rem !important}
.dr-field{margin-bottom:.65rem}
.dr-hintlbl{text-transform:none;letter-spacing:normal;color:var(--faint);font-size:.6rem}
.dr-choicehead{
  display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;
}
.mini{
  background:rgba(212,178,106,.14);border:1px solid rgba(212,178,106,.4);color:var(--gold);
  font-family:var(--mono);font-size:.64rem;padding:.25rem .5rem;border-radius:4px;cursor:pointer;text-transform:none;
}
.choice{display:grid;grid-template-columns:1fr 1.25fr auto;gap:.3rem;margin-bottom:.3rem;align-items:start}
.ch-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:.8rem;padding:.35rem .2rem}
.ch-x:hover{color:var(--rust)}
.dr-foot{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}
.dr-warn{font-family:var(--mono);font-size:.58rem;color:var(--faint);line-height:1.5;margin-top:.15rem;text-transform:none;letter-spacing:normal}
.dr-threads{font-family:var(--mono);font-size:.64rem;color:var(--muted);line-height:1.6;margin:-.2rem 0 .7rem}
.dr-engine{border:1px solid var(--line);border-radius:6px;padding:.6rem .7rem;margin-top:.9rem;background:var(--bg)}
.dr-engine-h{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.4rem}
.eng-line{display:flex;gap:.5rem;font-family:var(--mono);font-size:.64rem;line-height:1.5;padding:.1rem 0}
.eng-k{color:var(--faint);flex:none;min-width:82px}
.eng-v{color:var(--bone);opacity:.85;word-break:break-word;min-width:0}
.dr-threads b{color:var(--gold);font-weight:400}
.dr-threads i{color:var(--rust);font-style:normal}

/* ── modal ───────────────────────────────────────────────────────────── */
.modal-wrap{
  position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;padding:1.2rem;
}
.modal{
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:min(600px,100%);
  max-height:86vh;display:flex;flex-direction:column;padding:1.1rem;overflow-y:auto;
}
.modal-h{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.75rem;
}
.modal-lead{font-family:var(--serif);font-size:1.02rem;line-height:1.55;margin:0 0 .9rem}
.modal-stats{
  font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.9;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.65rem .8rem;margin-bottom:.9rem;
}
.modal-stats b{color:var(--bone);font-weight:400}
.modal-foot{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.4rem;flex-wrap:wrap}
.note{
  border:1px solid rgba(212,178,106,.3);background:rgba(212,178,106,.05);border-radius:6px;
  padding:.7rem .8rem;margin-bottom:.9rem;
}
.note-h{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
}
.note-lead{font-size:.78rem;color:var(--muted);line-height:1.5;margin:.5rem 0 .4rem}
.note-list{margin:0;padding-left:1.05rem;max-height:180px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.note-list li{font-family:var(--mono);font-size:.66rem;line-height:1.65;color:var(--bone);margin-bottom:.3rem;opacity:.86}
.drop{
  border:1px dashed var(--line);border-radius:8px;padding:1.5rem 1rem;text-align:center;
  color:var(--muted);font-family:var(--mono);font-size:.74rem;line-height:1.7;cursor:pointer;
  transition:border-color .12s,background .12s;background:var(--bg);
}
.drop:hover,.drop.over{border-color:var(--gold);background:rgba(212,178,106,.06);color:var(--bone)}
.drop b{color:var(--gold);font-weight:400}
.err{color:var(--rust);font-family:var(--mono);font-size:.72rem;line-height:1.6;margin-top:.7rem}

/* ── playtest ────────────────────────────────────────────────────────── */
.play-wrap{
  position:absolute;inset:0;z-index:34;background:rgba(14,13,11,.93);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
.play-stage{
  width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.play-head{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;
  padding:.6rem .9rem;border-bottom:1px solid var(--line);background:#1e1c18;
}
.play-track{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.play-track b{color:var(--gold);font-weight:400}
.play-body{padding:1.1rem 1.1rem .9rem;overflow-y:auto;-webkit-overflow-scrolling:touch}
.play-eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.35rem}
.play-title{font-family:var(--serif);font-size:1.55rem;font-weight:600;margin:0 0 .25rem;line-height:1.2}
.play-sub{font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.9rem}
.play-sub .spine{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:.4rem;vertical-align:-1px}
.play-hook{font-family:var(--serif);font-size:1.06rem;line-height:1.7;margin:0 0 .9rem}
.play-teaches{
  border-left:2px solid rgba(212,178,106,.35);padding:.15rem 0 .15rem .75rem;margin:0 0 1.1rem;
  color:var(--muted);font-size:.83rem;line-height:1.6;font-style:italic;
}
.play-teaches b{font-style:normal;font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);display:block;margin-bottom:.2rem;font-weight:400}
.choice-btn{
  display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:.7rem .8rem;margin-bottom:.5rem;cursor:pointer;color:var(--bone);
  font-family:var(--sans);transition:border-color .12s,background .12s;
}
.choice-btn:hover{border-color:rgba(212,178,106,.55);background:#2c2922}
.choice-btn.locked{opacity:.45;cursor:not-allowed}
.choice-btn.locked:hover{border-color:var(--line);background:var(--panel)}
.choice-key{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-right:.45rem}
.choice-lbl{font-family:var(--serif);font-size:1.02rem}
.choice-fx{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:.3rem;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.4rem}
.chip{font-family:var(--mono);font-size:.6rem;padding:.15rem .4rem;border-radius:4px;border:1px solid}
.chip.gain{color:var(--gold);border-color:rgba(212,178,106,.4);background:rgba(212,178,106,.08)}
.chip.need{color:var(--rust);border-color:rgba(217,138,118,.4);background:rgba(217,138,118,.09)}
.chip.have{color:var(--sage);border-color:rgba(122,155,110,.45);background:rgba(122,155,110,.1)}
.chip.plain{color:var(--muted);border-color:var(--line);background:var(--bg)}
.chip.fork{color:#8fd4d4;border-color:rgba(74,157,157,.5);background:rgba(74,157,157,.1)}
.chip.gone{color:var(--rust);border-color:rgba(217,138,118,.45);background:rgba(217,138,118,.09);text-decoration:line-through}
.pick-h{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:1.1rem 0 .4rem;display:flex;align-items:center;gap:.5rem;
}
.pick-h:first-child{margin-top:0}
.pick-h.unlocked{color:var(--gold)}
.pick-item{
  display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:.55rem .7rem;
  margin-bottom:.35rem;cursor:pointer;color:var(--bone);font-family:var(--sans);
  transition:border-color .12s,background .12s;
}
.pick-item:hover{background:#2c2922}
.pick-body{flex:1;min-width:0}
.pick-title{font-family:var(--serif);font-size:.98rem;display:block}
.pick-meta{font-family:var(--mono);font-size:.6rem;color:var(--muted);display:block;margin-top:.15rem}
.pick-why{font-family:var(--mono);font-size:.6rem;color:var(--gold);flex:none;max-width:45%;text-align:right}
.play-foot{
  padding:.65rem .9rem calc(.65rem + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:center;
}
.play-gained{
  border:1px solid rgba(212,178,106,.3);background:rgba(212,178,106,.06);border-radius:8px;
  padding:.7rem .8rem;margin-bottom:1rem;
}
.play-gained .lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.play-quiet{font-family:var(--mono);font-size:.68rem;color:var(--faint);line-height:1.6}
.play-ledger{font-family:var(--mono);font-size:.66rem;color:var(--gold);opacity:.85;margin-top:.2rem}
.ask-note{color:var(--faint);font-style:italic}
.play-body select{
  background:var(--bg);border:1px solid var(--line);color:var(--bone);border-radius:4px;
  padding:.45rem .5rem;font-family:var(--sans);font-size:.88rem;width:100%;
}
.play-body select:focus{outline:none;border-color:var(--gold)}
.sum-h{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:1.1rem 0 .35rem}
.sum-h:first-child{margin-top:0}
.sum-step{display:flex;gap:.6rem;padding:.3rem 0;border-bottom:1px solid rgba(57,53,45,.5);font-size:.84rem}
.sum-step .num{font-family:var(--mono);font-size:.66rem;color:var(--faint);flex:none;width:1.4rem}
.sum-step .what{flex:1;min-width:0}
.sum-step .took{color:var(--muted);font-size:.78rem;display:block;margin-top:.1rem}
.sum-step .took i{color:var(--gold);font-style:normal;font-family:var(--mono);font-size:.66rem}
.sum-note{font-size:.82rem;color:var(--muted);line-height:1.6;margin:.2rem 0 .5rem}
.sum-note b{color:var(--bone);font-weight:400}

.toast{
  position:absolute;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:40;background:rgba(30,28,24,.97);border:1px solid var(--line);border-radius:20px;
  padding:.45rem .95rem;font-family:var(--mono);font-size:.7rem;color:var(--bone);
  box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:calc(100% - 2rem);text-align:center;
}
.toast.warn{border-color:rgba(217,138,118,.5);color:var(--rust)}

@media (max-width:620px){
  .brand-sub{display:none}
  /* One compact scrolling row instead of six wrapped ones — the view controls
     move into the ⋯ menu, and pinch covers zoom. */
  /* nowrap matters: a wrapping column flex sizes its line to the widest child,
     which lets the toolbar push the page sideways instead of scrolling. */
  .bar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:.4rem;padding-bottom:.5rem}
  .on-wide{display:none !important}
  /* min-width:0 — without it the flex item refuses to shrink below its content
     and the scroller pushes the page sideways instead of scrolling itself. */
  .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:.3rem;padding-bottom:1px;min-width:0}
  .tools::-webkit-scrollbar{display:none}
  .tools > *{flex:none}
  .search{width:96px}
  .drawer{top:auto;bottom:0;left:0;right:0;width:100%;height:74vh;border-left:none;border-top:1px solid var(--line);border-radius:12px 12px 0 0}
  .dr-row3{grid-template-columns:1fr 1fr}
  .panel.legend,.panel.coverage{left:.5rem;right:.5rem;max-width:none;width:auto}
  .panel.menu{left:.5rem;right:.5rem;width:auto}
  .modal{padding:.9rem}
  .play-wrap{padding:0}
  .play-stage{width:100%;height:100%;max-height:100%;border:none;border-radius:0}
  .play-body{padding:1rem .85rem .8rem}
  .play-title{font-size:1.35rem}
  .pick-why{max-width:38%}
  .kbd-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms !important;animation-duration:.001ms !important}
}

<body>
<div class="root" id="root">

  <header class="bar" id="bar">
    <div class="brand">
      <span class="brand-serif">Thread Web</span>
      <span class="brand-sub">Remnant Continent · encounter canvas</span>
    </div>
    <div class="tools">
      <button id="btn-add" class="btn primary">+ Encounter</button>
      <button id="btn-play" class="btn">Walk</button>
      <button id="btn-connect" class="btn">Connect</button>
      <span class="grp on-wide">
        <span class="sep"></span>
        <button id="btn-zin" class="btn ghost" aria-label="Zoom in">+</button>
        <button id="btn-zout" class="btn ghost" aria-label="Zoom out">–</button>
        <span id="zoomval" class="zoom" aria-live="off">60%</span>
        <button id="btn-fit" class="btn ghost">Fit</button>
        <button id="btn-tidy" class="btn ghost">Tidy</button>
        <span class="sep"></span>
      </span>
      <button id="btn-legend" class="btn" aria-expanded="false">Legend</button>
      <button id="btn-coverage" class="btn chipbtn" aria-expanded="false"><span id="cov-chip">coverage</span></button>
      <button id="btn-systems" class="btn" aria-expanded="false">Systems</button>
      <div class="seg on-wide" role="group" aria-label="Color nodes by">
        <span class="seglbl">color</span>
        <button id="btn-color-faction" class="segbtn on">faction</button>
        <button id="btn-color-status" class="segbtn">status</button>
      </div>
      <input id="search" class="search" type="search" placeholder="search…" aria-label="Search encounters">
      <span class="sep on-wide"></span>
      <button id="btn-export" class="btn">Export</button>
      <button id="btn-import" class="btn">Import</button>
      <button id="btn-board" class="btn ghost" aria-label="Board actions" aria-expanded="false">⋯</button>
    </div>
  </header>

  <div id="hint" class="hint" hidden></div>
  <div id="legendpanel" class="panel legend" hidden></div>
  <div id="coveragepanel" class="panel coverage" hidden></div>
  <div id="systemspanel" class="panel coverage" hidden></div>
  <div id="boardmenu" class="panel menu" hidden></div>

  <svg id="canvas" class="canvas" role="application" aria-label="Encounter canvas">
    <defs>
      <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#d4b26a"/>
      </marker>
      <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#4a9d9d"/>
      </marker>
      <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9a9484"/>
      </marker>
    </defs>
    <rect data-bg="1" x="0" y="0" width="100%" height="100%" fill="transparent"></rect>
    <g id="world"></g>
  </svg>

  <aside id="drawer" class="drawer" hidden aria-label="Encounter editor"></aside>
  <div id="play" class="play-wrap" hidden aria-label="Thread walk"></div>
  <div id="modal" class="modal-wrap" hidden></div>
</div>

<script>
(function () {
"use strict";

/* ════════════════════════════════════════════════════════════════════════
   THREAD WEB — Remnant Continent encounter canvas.
   Single self-contained file: no backend, no build step, no network.
   Cluster by type · color by faction (or status) · tie by shared flags ·
   edit in plain language · export JSON for Claude to mechanize.
   The data contract lives in exportBoard()/normalizeBoard() — keep it stable.
   ═══════════════════════════════════════════════════════════════════════ */

var NS = "http://www.w3.org/2000/svg";
var $ = function (sel) { return document.querySelector(sel); };

/* ── domain ───────────────────────────────────────────────────────────── */

var FACTIONS = {
  none:      { label: "Frontier / none", color: "#a59d8c" },
  versari:   { label: "Versari Korad",   color: "#3fb6b6" },
  lakers:    { label: "Grand Lakers",    color: "#5b95e6" },
  goldgrass: { label: "Goldgrass",       color: "#e0b53f" },
  plainers:  { label: "Free Plainers",   color: "#e0634a" }
};
var TYPES = {
  salvage: { label: "Salvage & Tech" },
  uncanny: { label: "The Uncanny" },
  hazard:  { label: "Frontier Hazard" },
  parley:  { label: "Parley" },
  social:  { label: "Social" },
  // Kinds the encounter-builder's own format distinguishes. Beats cluster by
  // quest instead of by type, so they get no type region of their own.
  world:   { label: "Settlement / world" },
  field:   { label: "Field encounter" },
  beat:    { label: "Quest beat", inQuest: true }
};
var STATUSES = {
  idea:       { label: "Idea",       color: "#6a655a" },
  drafted:    { label: "Drafted",    color: "#e0b53f" },
  structured: { label: "Structured", color: "#7a9b6e" }
};
var SCOPES = { universal: { label: "universal" }, gated: { label: "faction-gated" } };
var UNKNOWN_COLOR = "#8a8478";

// Enums are additive by contract: an unrecognised value from an older or newer
// export is kept verbatim and shown as-is rather than being silently rewritten.
function factionColor(f) { return (FACTIONS[f] && FACTIONS[f].color) || UNKNOWN_COLOR; }
function statusColor(s)  { return (STATUSES[s] && STATUSES[s].color) || UNKNOWN_COLOR; }
function typeLabel(t)    { return (TYPES[t] && TYPES[t].label) || String(t); }
function factionLabel(f) { return (FACTIONS[f] && FACTIONS[f].label) || String(f); }
function statusLabel(s)  { return (STATUSES[s] && STATUSES[s].label) || String(s); }

var W = 180, H = 66, PADX = 30, PADY = 26;
var K_MIN = 0.06, K_MAX = 2.6;

/* ── seed board ───────────────────────────────────────────────────────── */

var SEED = [
  { id:"fe_humming_room", n:1, title:"The Humming Room", type:"salvage", faction:"versari", scope:"universal", status:"structured",
    hook:"An old-world console still draws power in a sealed sub-level, patient through every winter since the end.",
    teaches:"Restored machines persist and nobody fully understands them; salvage-now vs study-slow.",
    choices:[{label:"Strip it for parts",fx:"+2 Resource"},{label:"Study the console",fx:"+1 Tech · sets studied_oldworld_machine"},{label:"Seal it and move on",fx:"—"}],
    out:["studied_oldworld_machine"], in:[], notes:"", x:300, y:230 },
  { id:"fe_cold_cellar", n:8, title:"The Cold Cellar", type:"salvage", faction:"goldgrass", scope:"universal", status:"drafted",
    hook:"A sealed old-world store room, intact: medicine, seed stock, sealed rations the living world can't make.",
    teaches:"Salvage vs inheritance — some goods can't be remade, and that scarcity is a temptation.",
    choices:[{label:"Take it all",fx:"+Resource · −Reputation if locals knew"},{label:"Share with the community",fx:"−gain · +Reputation · +standing (agrarian) · sets shared_the_cellar"},{label:"Seed-bank it",fx:"QUEUE_DEFERRED: larger return later"}],
    out:["shared_the_cellar"], in:[], notes:"", x:300, y:360 },
  { id:"fe_one_who_listens", n:2, title:"The One Who Listens", type:"uncanny", faction:"none", scope:"universal", status:"structured",
    hook:"A frontier Reader sits apart at the settlement's edge — fed, unmet in the eye, believed and unnamed.",
    teaches:"Perception is real and unevenly distributed; communities revere and fear it at once.",
    choices:[{label:"Ask what's ahead",fx:"PEEK 2 encounter cards"},{label:"Offer her a place",fx:"−Resource · +Reputation · sets befriended_reader"},{label:"Leave her be",fx:"—"}],
    out:["befriended_reader"], in:[], notes:"", x:760, y:170 },
  { id:"fe_still_water", n:6, title:"The Still Water", type:"uncanny", faction:"lakers", scope:"gated", status:"drafted",
    hook:"A Laker boatman has pulled ashore where no sane pilot would, waiting for the lake to settle.",
    teaches:"Water-sense, open and unembarrassed — the gift is believed without question.",
    choices:[{label:"Wait with him",fx:"tempo cost · PEEK / deferred shelter"},{label:"Press on against warning",fx:"deferred −Strength/Resource"},{label:"Hire him to pilot",fx:"−Resource · lasting benefit · sets trusted_watersense"}],
    out:["trusted_watersense"], in:[], notes:"Gated to Lakers/Clan Tempest — see engine dep.", x:960, y:200 },
  { id:"fe_quiet_camp", n:9, title:"The Quiet Camp", type:"uncanny", faction:"none", scope:"universal", status:"drafted",
    hook:"A camp with the fire still warm and the gear undisturbed. No blood, no struggle. They simply aren't here.",
    teaches:"The thinned boundary — kept small and unexplained. Texture, not a threat.",
    choices:[{label:"Search the camp",fx:"+Resource · a unit picks up wrongness"},{label:"Leave an offering",fx:"−Resource · sets respected_the_quiet"},{label:"Study it (gated)",fx:"needs befriended_reader OR trusted_watersense → PEEK / foreshadow"}],
    out:["respected_the_quiet"], in:["befriended_reader","trusted_watersense"], notes:"Intentionally rare.", x:850, y:330 },
  { id:"fe_dry_line", n:4, title:"The Dry Line", type:"hazard", faction:"none", scope:"universal", status:"drafted",
    hook:"A creek that should be running isn't, and the grass downstream will follow it into dust.",
    teaches:"Water is the quiet currency of this world; the land is still settling and the maps lie.",
    choices:[{label:"Dig for the water table",fx:"−Resource · sets found_water"},{label:"Read the land and reroute",fx:"— safe pass"},{label:"Push through fast",fx:"−Strength/Movement"}],
    out:["found_water"], in:[], notes:"", x:1290, y:260 },
  { id:"fe_steel_for_steel", n:5, title:"Steel for Steel", type:"parley", faction:"plainers", scope:"universal", status:"drafted",
    hook:"A hard band blocks the track. Their spokesman doesn't want to talk — he wants to see what you're made of.",
    teaches:"The steel pole: a fair fight is the negotiation, and respect is the only currency that sticks.",
    choices:[{label:"Face their champion",fx:"Strength contest · sets earned_steel_respect · +standing (raider)"},{label:"Pay the toll",fx:"−Resource · no respect"},{label:"Refuse and force through",fx:"opens hostility"}],
    out:["earned_steel_respect"], in:[], notes:"Variant candidate if player IS Plainers.", x:450, y:710 },
  { id:"fe_cracked_axle", n:3, title:"Cracked Axle", type:"social", faction:"none", scope:"universal", status:"structured",
    hook:"A stranded caravan in country with no law but reputation. Help, trade, or take.",
    teaches:"Out here reputation is the only law; both plains poles — trade and steel — are live paths.",
    choices:[{label:"Lend aid and tools",fx:"−Resource · +Reputation · +standing (trade pole)"},{label:"Trade fairly",fx:"+Resource"},{label:"Take what you want",fx:"+2 Resource · −Reputation · +standing (raider pole)"}],
    out:[], in:[], notes:"Needs self-faction token for standing lines.", x:1000, y:710 },
  { id:"fe_tally_stone", n:7, title:"The Tally Stone", type:"social", faction:"goldgrass", scope:"universal", status:"drafted",
    hook:"Two settlements share a boundary marker and a slow argument about which way it's been moved.",
    teaches:"No higher authority exists yet — justice is whoever people will agree to heed.",
    choices:[{label:"Rule for one side",fx:"+favor / −grudge"},{label:"Broker a split",fx:"−Resource · +Reputation · sets brokered_peace"},{label:"Walk away",fx:"— quarrel festers"}],
    out:["brokered_peace"], in:[], notes:"", x:1150, y:750 }
];

/* ── persistence (swappable: localStorage today, a server tomorrow) ───── */

var STORAGE_KEY = "remnant.threadweb.board.v1";
var Store = {
  load: function () {
    return new Promise(function (resolve) {
      var raw = null;
      try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (e) { /* private mode */ }
      if (!raw) return resolve(null);
      try { resolve(JSON.parse(raw)); } catch (e) { resolve(null); }
    });
  },
  save: function (board) {
    return new Promise(function (resolve) {
      try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(board)); resolve(true); }
      catch (e) { resolve(false); }
    });
  },
  clear: function () {
    return new Promise(function (resolve) {
      try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      resolve(true);
    });
  }
};

/* ── data contract ────────────────────────────────────────────────────── */

var ENCOUNTER_ORDER = ["id","n","title","type","faction","scope","status","hook",
                       "teaches","choices","out","in","notes","x","y"];

var idSeq = 0;
function newId(prefix) {
  idSeq += 1;
  return (prefix || "fe_") + Date.now().toString(36) + idSeq.toString(36);
}
function str(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
function num(v) { var n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : null; }
// Boards written before flag names were tokenized properly can hold a single
// "a OR b" flag that nothing can ever read. Repair on load, but keep a record —
// silently rewriting authored data without saying so would be worse.
var flagRepairs = [];
function flagList(v) {
  var raw = Array.isArray(v) ? v : (typeof v === "string" ? [v] : []);
  var out = [];
  raw.forEach(function (x) {
    var parts = parseFlags(x);
    if (typeof x === "string" && parts.length > 1 && x.indexOf(",") === -1) {
      flagRepairs.push({ from: x.trim(), into: parts.slice() });
    }
    out = out.concat(parts);
  });
  return uniq(out);
}

// A flag is one snake_case token, so anything that isn't [A-Za-z0-9_] separates
// two of them — a comma, a slash, a pipe, or plain whitespace. That makes
// "a OR b" two flags rather than one flag whose name contains " OR ", which
// nothing could ever read. The joining words are dropped, not kept as flags.
var JOIN_WORDS = { or: 1, and: 1, then: 1, plus: 1 };
function parseFlags(s) {
  return uniq(str(s).split(/[^A-Za-z0-9_]+/)
    .map(function (x) { return x.trim(); })
    .filter(function (x) { return x && !JOIN_WORDS[x.toLowerCase()]; }));
}

// Was this written as an either/or rather than a list? Used to tell a run that
// a choice grants one of these, not all of them.
function splitsOnOr(text) { return /(^|[^A-Za-z0-9_])or([^A-Za-z0-9_]|$)/i.test(str(text)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function uniq(a) { var s = {}, o = []; a.forEach(function (v) { if (!s[v]) { s[v] = 1; o.push(v); } }); return o; }

function normalizeEncounter(raw) {
  var e = (raw && typeof raw === "object") ? raw : {};
  var known = {
    id: str(e.id).trim() || newId(),
    n: (e.n === null || e.n === undefined || e.n === "") ? null : num(e.n),
    title: str(e.title) || "Untitled encounter",
    type: str(e.type) || "salvage",
    faction: str(e.faction) || "none",
    scope: str(e.scope) || "universal",
    status: str(e.status) || "idea",
    hook: str(e.hook),
    teaches: str(e.teaches),
    choices: Array.isArray(e.choices)
      ? e.choices.map(function (c) {
          var o = { label: str(c && c.label), fx: str(c && c.fx) };
          if (c && c.engine) o.engine = c.engine;      // effects, condition, outcomeText
          return o;
        })
      : [],
    out: flagList(e.out),
    in: flagList(e["in"]),
    notes: str(e.notes),
    x: num(e.x),
    y: num(e.y)
  };
  // Anything we don't know about rides along untouched, so a future field added
  // upstream survives a round-trip through this tool.
  var extras = {}, present = {};
  Object.keys(e).forEach(function (k) {
    present[k] = true;
    if (ENCOUNTER_ORDER.indexOf(k) === -1) extras[k] = e[k];
  });
  var enc = Object.assign(extras, known);
  // Which keys the source actually carried. A merge applies only those, so a
  // partial encounter from a chat can't blank the fields it left out.
  Object.defineProperty(enc, "_present", {
    value: present, enumerable: false, writable: true, configurable: true
  });
  return enc;
}

function normalizeLink(raw) {
  var l = (raw && typeof raw === "object") ? raw : {};
  var from = str(l.from).trim(), to = str(l.to).trim();
  if (!from || !to || from === to) return null;
  return { from: from, to: to };
}

// A beat is an encounter internally — same fields, same graph — plus its quest
// position (deliver, prereqs). exportQuests() puts it back into §7 shape.
var BEAT_ORDER = ["id", "title", "deliver", "text", "choices", "out", "in", "prereqs", "notes"];

function normalizeBeat(raw, quest, i) {
  var b = (raw && typeof raw === "object") ? raw : {};
  var enc = normalizeEncounter({
    id: b.id, title: b.title || ((quest.title || "Quest") + " · beat " + (i + 1)),
    type: "beat", faction: b.faction || quest.faction || "none",
    scope: b.scope || "universal", status: b.status || "structured",
    hook: b.text !== undefined ? b.text : b.hook, teaches: b.teaches,
    choices: b.choices, out: b.out, "in": b["in"], notes: b.notes,
    x: b.x, y: b.y
  });
  enc.deliver = str(b.deliver) || "auto";
  enc.prereqs = Array.isArray(b.prereqs) ? b.prereqs.map(str).filter(Boolean) : [];
  if (typeof b.ordinal === "number") enc.ordinal = b.ordinal;
  // Anything else the beat carried (deliverCondition, art, engine payload) rides along.
  Object.keys(b).forEach(function (k) {
    if (BEAT_ORDER.indexOf(k) === -1 && ["ordinal", "text", "faction", "scope", "status", "x", "y", "teaches"].indexOf(k) === -1) {
      enc[k] = b[k];
    }
  });
  return enc;
}

function exportBeat(b) {
  var o = {};
  BEAT_ORDER.forEach(function (k) {
    o[k] = k === "text" ? b.hook : b[k];
  });
  if (typeof b.ordinal === "number") o.ordinal = b.ordinal;
  if (b.x != null) { o.x = b.x; o.y = b.y; }
  Object.keys(b).forEach(function (k) {
    if (BEAT_ORDER.indexOf(k) !== -1) return;
    if (k.charAt(0) === "_") return;
    if (["hook", "teaches", "type", "ordinal", "x", "y"].indexOf(k) !== -1) return;
    o[k] = b[k];
  });
  return o;
}

function normalizeQuest(raw) {
  var q = (raw && typeof raw === "object") ? raw : {};
  var out = {};
  Object.keys(q).forEach(function (k) { if (k !== "beats") out[k] = q[k]; });
  out.id = str(q.id).trim() || newId("q_");
  out.title = str(q.title) || "Untitled quest";
  out.mode = str(q.mode) || "single-player";
  out.notes = str(q.notes);
  out.beats = (Array.isArray(q.beats) ? q.beats : []).map(function (b, i) {
    return normalizeBeat(b, out, i);
  });
  return out;
}

function exportQuest(q) {
  var o = {};
  Object.keys(q).forEach(function (k) {
    if (k === "beats" || k.charAt(0) === "_") return;
    o[k] = q[k];
  });
  o.beats = questBeatsInOrder(q).map(exportBeat);
  return o;
}

function normalizeBoard(raw) {
  var b = raw;
  if (Array.isArray(b)) b = { encounters: b };                 // a bare encounter array
  if (!b || typeof b !== "object") return null;
  if (isEngineFile(b)) return engineToBoard(b);                // the builder's table-grouped export
  if (!Array.isArray(b.encounters)) {
    if (Array.isArray(b.quests) && b.quests.length) b = Object.assign({ encounters: [] }, b);
    else if (b.encounter && typeof b.encounter === "object") b = { encounters: [b.encounter] };
    else if (b.id && b.title) b = { encounters: [b] };          // a single encounter object
    else return null;
  }
  var seen = {};
  var encounters = b.encounters.map(normalizeEncounter).filter(function (e) {
    if (seen[e.id]) return false;                               // last-wins would hide edits; first wins
    seen[e.id] = 1; return true;
  });
  var links = (Array.isArray(b.links) ? b.links : []).map(normalizeLink).filter(Boolean);
  var quests = (Array.isArray(b.quests) ? b.quests : []).map(normalizeQuest);
  var out = { encounters: encounters, links: links, quests: quests };
  if (b.engine) out.engine = b.engine;
  return out;
}

function exportEncounter(e) {
  var o = {};
  ENCOUNTER_ORDER.forEach(function (k) { o[k] = e[k]; });
  Object.keys(e).forEach(function (k) {
    if (ENCOUNTER_ORDER.indexOf(k) === -1 && k.charAt(0) !== "_") o[k] = e[k];
  });
  return o;
}

// Travels inside every export. The file is the whole interface between this
// tool and whoever mechanizes it, so it carries its own return-format contract.
var HOW_TO_REPLY = [

var HOW_TO_REPLY_CHAT =
  "This is a Thread Web board export (plain-language authoring intent, not engine JSON). " +
  "When you send encounters back, reply with a .json file or one fenced json block shaped like the export: " +

function exportBoard() {
  var out = {
    meta: {
      tool: "thread-web",
      version: 1,
      exportedAt: new Date().toISOString(),
      importMode: "merge-by-id",
      howToReplyToThisFile: HOW_TO_REPLY
    },
    encounters: board.encounters.map(exportEncounter),
    links: board.links.map(function (l) { return { from: l.from, to: l.to }; })
  };
  if (board.quests && board.quests.length) out.quests = board.quests.map(exportQuest);   // §7
  if (board.engine) out.engine = board.engine;   // the builder rows, kept whole
  return out;
}

/* ════════════════════════════════════════════════════════════════════════
   ENGINE FORMAT — the encounter-builder's table-grouped JSON
   (world_encounters, field_encounters, quests, quest_beats,
    quest_beat_prereqs, choices, effects).

   Import reads it into the board; nothing is dropped. Every source row is kept
   verbatim under board.engine so the file can be handed back unchanged, and
   each node/choice keeps a pointer into its own rows. Effects and conditions
   the tool doesn't simulate are preserved and reported, never stripped.
   ═══════════════════════════════════════════════════════════════════════ */

var ENGINE_TABLES = ["world_encounters", "field_encounters", "quests",
                     "quest_beats", "quest_beat_prereqs", "choices", "effects"];

function isEngineFile(b) {
  if (!b || typeof b !== "object") return false;
  var hit = 0;
  ENGINE_TABLES.forEach(function (t) { if (Array.isArray(b[t])) hit++; });
  return hit >= 3 && Array.isArray(b.choices) && Array.isArray(b.effects);
}

// Effect types the run can actually carry out. Anything else is preserved,
// listed in Systems, and logged as an engine ask when a run hits it.
var SIMULATED_EFFECTS = {
  SET_PLAYER_FLAG: 1, ADJUST_RESOURCE: 1, ADJUST_TRACK: 1, ADJUST_STANDING: 1,
  ADJUST_HONOR: 1, ADJUST_MENACE: 1, COMPLETE_QUEST: 1,
  QUEUE_DEFERRED: 1, ROLL: 1, CONTEST: 1, FORCE_CHOICE: 1
};

// Named, phrased and logged, but with nothing behind them: there is no deck to
// peek into or deliver from, and quest position is held by prereqs rather than
// by ADVANCE_QUEST. They were being counted as modelled, which is what let a
// board look complete while half its sequencing sat idle.
var NAMED_ONLY_EFFECTS = { ADVANCE_QUEST: 1, DELIVER_ENCOUNTER: 1, PEEK: 1 };
var SIMULATED_CONDITIONS = {
  has_flag: 1, count_flags: 1, all: 1, any: 1, not: 1, op: 1, score: 1, "if": 1
};

function effParams(e) {
  var p = (e && (e.paramsJson || e.params)) || {};
  return (typeof p === "object" && p) ? p : {};
}

function walkEffects(list, fn) {
  (list || []).forEach(function (e) {
    if (!e || typeof e !== "object" || !e.type) return;
    fn(e);
    var p = effParams(e);
    ["effects", "onSuccess", "onFail", "onWin", "onLose"].forEach(function (k) {
      if (Array.isArray(p[k])) walkEffects(p[k], fn);
    });
    (p.options || []).forEach(function (o) {
      if (o && Array.isArray(o.effects)) walkEffects(o.effects, fn);
    });
  });
}

function flagsSetBy(effects) {
  var out = [];
  walkEffects(effects, function (e) {
    if (e.type === "SET_PLAYER_FLAG") {
      var p = effParams(e);
      if (p.flag && p.value !== false) out.push(String(p.flag));
    }
  });
  return uniq(out);
}

// has_flag comes in two shapes in the wild: {"has_flag":{"flag":"x"}} and the
// shorthand {"has_flag":"x"}. Both name the same flag; reading only the first
// made the second evaluate false forever.
function flagName(v) {
  if (typeof v === "string") return v;
  return (v && v.flag) ? String(v.flag) : "";
}

function flagsReadBy(cond) {
  var out = [];
  (function walk(c) {
    if (Array.isArray(c)) return c.forEach(walk);
    if (!c || typeof c !== "object") return;
    Object.keys(c).forEach(function (k) {
      if (k === "has_flag") { var f = flagName(c[k]); if (f) out.push(f); }
      walk(c[k]);
    });
  })(cond);
  return uniq(out);
}

function conditionOps(cond) {
  var out = [];
  (function walk(c) {
    if (Array.isArray(c)) return c.forEach(walk);
    if (!c || typeof c !== "object") return;
    Object.keys(c).forEach(function (k) {
      if (["has_flag", "count_flags", "all", "any", "not", "op", "score", "if"].indexOf(k) !== -1) out.push(k);
      walk(c[k]);
    });
  })(cond);
  return uniq(out);
}

var SIGN = function (n) { return (n > 0 ? "+" : "") + n; };

// One effect as a line of plain language — this is what fills choices[].fx, so
// the whole tool (search, the drawer, the run) reads engine content natively.
function effectPhrase(e) {
  var p = effParams(e);
  switch (e.type) {
    case "SET_PLAYER_FLAG":
      return (p.value === false ? "clears " : "sets ") + p.flag;
    case "ADJUST_RESOURCE": return SIGN(p.amount) + " " + p.resource;
    case "ADJUST_TRACK":    return p.track + " " + SIGN(p.amount);
    case "ADJUST_STANDING": return "standing " + SIGN(p.amount) + " with " + factionLabel(p.faction);
    case "ADJUST_HONOR":    return "honor " + SIGN(p.amount);
    case "ADJUST_MENACE":   return "menace " + SIGN(p.amount);
    case "ADJUST_BASE_STRENGTH": return "base strength " + SIGN(p.amount);
    case "MODIFY_STAT":     return p.stat + " " + SIGN(p.amount) + (p.duration ? " for " + p.duration : "");
    case "ADVANCE_QUEST":   return "advances to " + p.beatId;
    case "COMPLETE_QUEST":  return "completes " + p.questId;
    case "QUEUE_DEFERRED":
      return "in " + p.delayRounds + " round" + (p.delayRounds === 1 ? "" : "s") + ": " +
             (p.effects || []).map(effectPhrase).join(", ");
    case "ROLL":
      return p.chance + "% chance → " + (p.onSuccess || []).map(effectPhrase).join(", ") +
             " · else " + (p.onFail || []).map(effectPhrase).join(", ");
    case "CONTEST":
      return "contest vs strength " + p.opponentStrength + " → win: " +
             (p.onWin || []).map(effectPhrase).join(", ") + " · lose: " +
             (p.onLose || []).map(effectPhrase).join(", ");
    case "FORCE_CHOICE":
      return "forced choice: " + (p.options || []).map(function (o) { return o.label; }).join(" / ");
    case "PEEK": return "peek " + p.count + " of " + p.deck;
    default:
      return e.type.toLowerCase().replace(/_/g, " ");
  }
}

function fxFromEffects(effects) {
  var parts = (effects || []).map(effectPhrase).filter(Boolean);
  return parts.join(" · ");
}

// A one-line English gloss of a condition, for the drawer and the run.
function conditionPhrase(c) {
  if (c === null || c === undefined) return "";
  if (typeof c !== "object") return String(c);
  if (c.has_flag) return "has " + flagName(c.has_flag);
  if (c.count_flags) return "count of " + c.count_flags.prefix + "* flags";
  if (c.not) return "not (" + conditionPhrase(c.not) + ")";
  if (c.all) return c.all.map(conditionPhrase).join(" and ");
  if (c.any) return c.any.map(conditionPhrase).join(" or ");
  if (c.score) return (c.score.kind || "score");
  if (c.op) {
    var ops = { eq: "is", ne: "is not", lt: "<", lte: "≤", gt: ">", gte: "≥" };
    return conditionPhrase(c.left) + " " + (ops[c.op] || c.op) + " " + conditionPhrase(c.right);
  }
  return JSON.stringify(c);
}

// The file names its faction-gated chains in _readme.faction_coverage as prose
// with real quest ids in it ("Goldgrass 3 (q_notes, q_seasons, q_hire)").
// Reading those ids recovers ownership the tables don't state anywhere else;
// anything not named stays frontier/none.
function questFactionsFromReadme(src) {
  var out = {};
  var rd = src && src._readme;
  var text = rd && rd.faction_coverage &&
             (rd.faction_coverage.gated_chains || rd.faction_coverage);
  if (typeof text !== "string") return out;
  var names = [
    [/versari/i, "versari"], [/laker/i, "lakers"],
    [/goldgrass/i, "goldgrass"], [/plainer/i, "plainers"]
  ];
  text.split("·").forEach(function (part) {
    var faction = null;
    names.forEach(function (n) { if (!faction && n[0].test(part)) faction = n[1]; });
    if (!faction) return;
    var ids = part.match(/q_[a-z0-9_]+/gi) || [];
    ids.forEach(function (id) { out[id] = faction; });
  });
  return out;
}

function engineToBoard(src) {
  var choicesByParent = {}, effectsByChoice = {};
  (src.choices || []).forEach(function (c) {
    (choicesByParent[c.parentId] = choicesByParent[c.parentId] || []).push(c);
  });
  Object.keys(choicesByParent).forEach(function (k) {
    choicesByParent[k].sort(function (a, b) { return (a.ordinal || 0) - (b.ordinal || 0); });
  });
  (src.effects || []).forEach(function (e) {
    (effectsByChoice[e.parentId] = effectsByChoice[e.parentId] || []).push(e);
  });
  Object.keys(effectsByChoice).forEach(function (k) {
    effectsByChoice[k].sort(function (a, b) { return (a.ordinal || 0) - (b.ordinal || 0); });
  });

  // Build a node's choices, and collect the flags its effects set and its
  // conditions read — that is what draws the web.
  function buildChoices(parentId) {
    var rows = choicesByParent[parentId] || [];
    var out = [], sets = [], needs = [];
    rows.forEach(function (c) {
      var effects = effectsByChoice[c.id] || [];
      sets = sets.concat(flagsSetBy(effects));
      needs = needs.concat(flagsReadBy(c.condition));
      out.push({
        label: str(c.label),
        fx: fxFromEffects(effects) || "—",
        engine: {
          id: c.id, ordinal: c.ordinal,
          outcomeText: str(c.outcomeText),
          condition: c.condition || null,
          effects: effects
        }
      });
    });
    return { choices: out, sets: uniq(sets), needs: uniq(needs) };
  }

  // Only claim a faction the data actually states: a choice gated on the active
  // player being one. Anything else stays frontier/none.
  function factionOf(parentIds) {
    var found = "none", gated = false;
    parentIds.forEach(function (pid) {
      (choicesByParent[pid] || []).forEach(function (c) {
        (function scan(x) {
          if (Array.isArray(x)) return x.forEach(scan);
          if (!x || typeof x !== "object") return;
          if (x.op === "eq" && x.left === "active" && typeof x.right === "string" && FACTIONS[x.right]) {
            found = x.right; gated = true;
          }
          Object.keys(x).forEach(function (k) { scan(x[k]); });
        })(c.condition);
      });
    });
    return { faction: found, gated: gated };
  }

  var encounters = [];

  (src.world_encounters || []).forEach(function (w) {
    var built = buildChoices(w.id);
    var f = factionOf([w.id]);
    encounters.push(normalizeEncounter({
      id: w.id, title: w.title, type: "world", faction: f.faction,
      scope: f.gated ? "gated" : "universal", status: "structured",
      hook: w.text, teaches: "",
      choices: built.choices, out: built.sets,
      "in": uniq(built.needs.concat(flagsReadBy(w.triggerCondition)).concat(flagsReadBy(w.triggerStrength))),
      notes: "",
      engine: {
        kind: "world_encounter", mode: w.mode, recipient: w.recipient,
        art: w.art, triggerCondition: w.triggerCondition || null,
        triggerStrength: w.triggerStrength
      }
    }));
  });

  (src.field_encounters || []).forEach(function (fe) {
    var built = buildChoices(fe.id);
    var f = factionOf([fe.id]);
    encounters.push(normalizeEncounter({
      id: fe.id, title: fe.title, type: "field", faction: f.faction,
      scope: f.gated ? "gated" : "universal", status: "structured",
      hook: fe.text, teaches: "",
      choices: built.choices, out: built.sets, "in": built.needs, notes: "",
      engine: { kind: "field_encounter", copies: fe.copies, art: fe.art }
    }));
  });

  var prereqsByBeat = {};
  (src.quest_beat_prereqs || []).forEach(function (p) {
    (prereqsByBeat[p.beatId] = prereqsByBeat[p.beatId] || []).push(p.prereqBeatId);
  });

  var beatsByQuest = {};
  (src.quest_beats || []).forEach(function (b) {
    (beatsByQuest[b.questId] = beatsByQuest[b.questId] || []).push(b);
  });

  var declared = questFactionsFromReadme(src);
  var quests = (src.quests || []).map(function (q) {
    var rows = (beatsByQuest[q.id] || []).slice().sort(function (a, b) {
      return (a.ordinal || 0) - (b.ordinal || 0);
    });
    var qf = factionOf(rows.map(function (b) { return b.id; }));
    if (declared[q.id]) { qf = { faction: declared[q.id], gated: true }; }
    return normalizeQuest({
      id: q.id, title: q.title, mode: q.mode, notes: "",
      faction: qf.faction,
      beats: rows.map(function (b, i) {
        var built = buildChoices(b.id);
        return {
          id: b.id,
          title: (q.title || "Quest") + " · " + (i + 1),
          deliver: b.deliver,
          text: b.text,
          ordinal: typeof b.ordinal === "number" ? b.ordinal : i,
          choices: built.choices,
          out: built.sets,
          "in": uniq(built.needs.concat(flagsReadBy(b.deliverCondition))),
          prereqs: prereqsByBeat[b.id] || [],
          notes: "",
          faction: qf.faction,
          scope: qf.gated ? "gated" : "universal",
          engine: {
            kind: "quest_beat", questId: q.id, art: b.art,
            placementFilter: b.placementFilter || null,
            deliverCondition: b.deliverCondition || null
          }
        };
      })
    });
  });

  return {
    encounters: encounters,
    links: [],
    quests: quests,
    // The source, kept whole: this is what an engine export hands back.
    engine: { source: src, importedAt: new Date().toISOString() }
  };
}

/* ── layout ───────────────────────────────────────────────────────────── */

// Positions are separated in place across every node — encounters and beats
// alike — so a node's identity and container never change with its coordinates.
function separateInPlace(fixedId) {
  var placed = separate(allNodes().map(function (n) {
    return { id: n.id, x: n.x, y: n.y };
  }), fixedId);
  var byId = {};
  placed.forEach(function (p) { byId[p.id] = p; });
  allNodes().forEach(function (n) {
    var p = byId[n.id];
    if (p) { n.x = p.x; n.y = p.y; }
  });
}

// No two cards may overlap. The dragged card is authoritative and never moves.
function separate(list, fixedId) {
  var out = list.map(function (n) { return Object.assign({}, n); });
  var needX = W + PADX, needY = H + PADY;
  for (var pass = 0; pass < 10; pass++) {
    var any = false;
    for (var i = 0; i < out.length; i++) for (var j = i + 1; j < out.length; j++) {
      var a = out[i], b = out[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var ox = needX - Math.abs(dx), oy = needY - Math.abs(dy);
      if (ox > 0 && oy > 0) {
        any = true;
        if (ox <= oy) {
          var dirx = dx < 0 ? -1 : 1;
          if (a.id === fixedId) b.x += dirx * ox;
          else if (b.id === fixedId) a.x -= dirx * ox;
          else { a.x -= dirx * ox / 2; b.x += dirx * ox / 2; }
        } else {
          var diry = dy < 0 ? -1 : 1;
          if (a.id === fixedId) b.y += diry * oy;
          else if (b.id === fixedId) a.y -= diry * oy;
          else { a.y -= diry * oy / 2; b.y += diry * oy / 2; }
        }
      }
    }
    if (!any) break;
  }
  return out;
}

var board = { encounters: [], links: [], quests: [] };
var view = { x: 30, y: 96, k: 0.6 };
var selectedId = null;
var mode = null;              // null | "connect"
var connectFrom = null;
var search = "";
var colorBy = "faction";      // "faction" | "status"
var hidden = { faction: {}, type: {}, status: {} };
var panel = null;             // null | "legend" | "coverage" | "menu"
var loaded = false;
var storageOK = true;
var nodeIndex = {};
var derived = null;

var canvas = $("#canvas"), world = $("#world"), bar = $("#bar");
var drawerEl = $("#drawer"), modalEl = $("#modal"), hintEl = $("#hint");
var legendEl = $("#legendpanel"), coverageEl = $("#coveragepanel"), menuEl = $("#boardmenu");
